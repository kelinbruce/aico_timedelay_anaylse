          maxLength: 64
        reasonCode:
          type: string
          description: 安全 reason code
          minLength: 1
          maxLength: 128
      required:
        - tenantId
        - userId
        - agentId

    LtmError:
      type: object
      description: 长期记忆错误响应
      properties:

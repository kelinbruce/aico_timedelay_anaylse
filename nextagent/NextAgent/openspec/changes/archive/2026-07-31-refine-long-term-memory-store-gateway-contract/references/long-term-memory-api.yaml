        - sourceMemoryId

    CopyPublishedMemoryResp:
      type: object
      description: 批量复制共享记忆响应
      properties:
        results:
          type: array
          description: 逐条复制结果，顺序与 memoryIds 一致
          items:
            $ref: '#/components/schemas/CopyPublishedMemoryResult'
      required:
        - results

    DeleteLongTermMemoryResp:
      type: object
      description: 删除长期记忆响应
      properties:
        memoryId:
          type: string
          description: 已删除 memory ID
      required:
        - memoryId

    PublishLongTermMemoryResp:

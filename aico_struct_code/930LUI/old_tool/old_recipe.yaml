                ],
                "5G下行平均速率": [
                    "用户下行平均吞吐率(速率)"
                ],
                "5G上行平均速率": [
                    "用户上行平均吞吐率(速率)"
                ]
            }
            sorted_keys = sorted(alias_5g.keys(), key=lambda k: len(k), reverse=True)
            all_matched = [k for k in sorted_keys if k.upper() in normalized_upper]
            filtered = []
            for k in all_matched:
                is_substring = any(
                    k in other and k != other
                    for other in all_matched
                )
                if not is_substring:
                    filtered.append(k)
            matched_values = []
            for key in filtered:
                flag = 0
                for value in alias_5g[key]:
                    if value.upper() in normalized_upper:
                        flag = 1
                        break
                if flag:
                    continue
                matched_values.append({
                    "key": key,
                    "value": alias_5g[key]
                })
            return matched_values

        joined_question = input_question
        joined_question_processed = preprocess_str(joined_question)

        top_related_kpis = [safe_get(x, "map") for x in _kpi_hits if safe_get(x, "map")][:50]
        top_related_kpis_cn = [safe_get(x, "map") for x in _kpi_cn_hits if safe_get(x, "map")][:50]
        top_related_filters = [safe_get(x, "map") for x in _filter_hits if safe_get(x, "map")][:50]
        top_related_configures = [safe_get(x, "name") for x in _configure_hits if safe_get(x, "name")][:50]
        top_related_kpis = dedupe_keep_order(top_related_kpis + top_related_kpis_cn)

        kpi_knowledge = [safe_get(x, "knowledge") for x in _kpi_hits if safe_get(x, "knowledge")][:50]
        kpi_cn_knowledge = [safe_get(x, "knowledge") for x in _kpi_cn_hits if safe_get(x, "knowledge")][:50]
        filter_knowledge = [safe_get(x, "knowledge") for x in _filter_hits if safe_get(x, "knowledge")][:50]
        configure_knowledge = [safe_get(x, "knowledge") for x in _configure_hits if safe_get(x, "knowledge")][:50]
        kpi_knowledge = dedupe_keep_order(kpi_knowledge + kpi_cn_knowledge)

        raw_enodeb_names = [safe_get(x, "knowledge") for x in _enodeb_hits if safe_get(x, "knowledge")][:50]
        raw_cell_names = [safe_get(x, "knowledge") for x in _cell_hits if safe_get(x, "knowledge")][:50]
        raw_rru_names = [safe_get(x, "knowledge") for x in _rru_hits if safe_get(x, "knowledge")][:50]
        raw_site_names = [safe_get(x, "knowledge") for x in _site_hits if safe_get(x, "knowledge")][:50]

        exact_features = build_exact_matches(kpi_knowledge + filter_knowledge + configure_knowledge + ["能耗"], joined_question_processed)
        exact_enodeb = build_exact_matches(raw_enodeb_names, joined_question_processed)
        exact_cell = build_exact_matches(raw_cell_names, joined_question_processed)
        exact_site = build_exact_matches(raw_site_names, joined_question_processed)
        exact_rru = build_exact_matches(raw_rru_names, joined_question_processed)

        # 黑话匹配：将alias对应的value（标准KPI名）追加到exact_features，使协商器判定feature完备
        alias_matched = match_aliases(input_question)
        alias_values = [v for a in alias_matched for v in a["value"]]
        exact_features = dedupe_keep_order(exact_features + alias_values)

        if "小区名称:Cell Name" not in top_related_filters and "小区" in input_question:
            top_related_filters.insert(0, "小区名称:Cell Name")
        if "enodeb名称:eNodeB Name" not in top_related_filters and ("基站" in input_question or "站点" in input_question or "enodeb" in input_question.lower()):
            top_related_filters.insert(0, "enodeb名称:eNodeB Name")

        recall_result = {
            "candidate_kpis": top_related_kpis,
            "candidate_filters": top_related_filters[:20],
            "candidate_configures": top_related_configures[:20],
            "candidate_features": dedupe_keep_order(top_related_kpis[:20] + top_related_filters[:20] + top_related_configures[:20] + alias_values),
            "exact_features": exact_features,
            "prompt_region_names": [],
            "prompt_cell_names": raw_cell_names[:20],
            "prompt_enodeb_names": raw_enodeb_names[:20],
            "prompt_site_names": raw_site_names[:20],
            "prompt_rruid_names": raw_rru_names[:20],
            "exact_cell": exact_cell,
            "exact_enodeb": exact_enodeb,
            "exact_site": exact_site,
            "exact_rruid": exact_rru,
            "exact_region": [],

            "time": {
                "database_start": DATABASE_START,
                "database_end": DATABASE_END,
                "current_time": CURRENT_TIME,
            },
            "alias": alias_matched,
        }

        print(json.dumps(recall_result, ensure_ascii=False))
    outputs:
      recall_result: ${python_result}

  # ── 协商规划 ──
  build_nego_plan_messages:
    type: python
    description: 构建协商规划 LLM 的 messages 和调用参数
    next:
      call_nego_plan_llm:
        condition: ''
    inputs:
      input_question: ${input_question}
      recall_result: ${recall_result}
      script: |-
        import json

        candidate_kpis = recall_result.get('candidate_kpis', [])[:60]
        candidate_filters = recall_result.get('candidate_filters', [])[:20]
        candidate_configures = recall_result.get('candidate_configures', [])[:20]

        exact_features = recall_result.get('exact_features', [])
        alias_info = recall_result.get('alias', [])

        prompt_cell_names = recall_result.get('prompt_cell_names', [])[:20]
        prompt_enodeb_names = recall_result.get('prompt_enodeb_names', [])[:20]
        prompt_site_names = recall_result.get('prompt_site_names', [])[:20]
        prompt_rruid_names = recall_result.get('prompt_rruid_names', [])[:20]
        exact_cell = recall_result.get('exact_cell', [])
        exact_enodeb = recall_result.get('exact_enodeb', [])
        exact_site = recall_result.get('exact_site', [])
        exact_rruid = recall_result.get('exact_rruid', [])
        exact_region = recall_result.get('exact_region', [])

        exact_summary = {
          "feature": exact_features,
          "enodeb": exact_enodeb,
          "site": exact_site,
          "cell": exact_cell,
          "rruid": exact_rruid
        }

        alias_display = ""
        if alias_info:
            alias_lines = [f'  "{a["key"]}" -> {json.dumps(a["value"], ensure_ascii=False)}' for a in alias_info]
            alias_display = "\n".join(alias_lines)

        import json

        nego_planner_prompt = f"""# 任务
        你是无线网络问数系统的意图协商与任务规划智能体。请结合用户问题、精确匹配结果和候选列表，在内部识别任务涉及的业务类型，判断feature、object、time三个维度是否完备，并生成后续工具执行计划。任一必要维度不完备时，只输出一次性追问，不生成计划；全部完备时，输出确认信息和总体计划。禁止输出分析过程、业务分类结果、工具调用命令或虚构数据。
        # 一、协商维度
        先在内部判断基础业务，但禁止在输出中增加classification或business_type字段。KPI查询需要feature、object、time；能耗查询需要object、time，不需要feature；工参筛选或工参查询需要feature、object，不需要time；配置查询需要feature、object，不需要time。混合任务取所需维度的并集。绘图和增益属于后续操作，其协商维度由依赖的基础查询决定。无法判断用户具体要查询什么时，设置feature.required=true、feature.matched=false。
        required=false的维度不参与完整性判断，统一输出matched=true并清空其他字段。任一required=true的维度matched=false时，plan必须为空字符串，message合并所有缺失项并以一个<Finished>结尾；全部必要维度matched=true时，plan必须非空，message只做简洁确认且不得包含<Finished>。

        # 二、feature规则
        feature只在required=true时判断，并根据业务类型分别使用对应候选：KPI只能使用KPI候选，工参只能使用工参候选，配置只能使用配置候选，禁止跨类型匹配。精确匹配结果优先级最高，已经精确识别的指标或参数必须直接采用；候选列表仅用于辅助判断和推荐，不代表系统完整支持范围。
        用户明确说出具体且无歧义的指标，即使候选中没有完全相同的名称，也应matched=true，confirmed保留用户原始中文名称或唯一匹配到的标准中文名，禁止用近似KPI替换。用户使用“PRB利用率”“吞吐率”“流量”“用户数”“性能”等宽泛表达，且候选中存在上下行、平均/总量、成功率/次数等多个口径时，将可能存在的多个口径均进行查询和呈现，不得追问；用户已经明确上行、下行、平均、最大、总和、累计等方向或统计口径时，应优先匹配相同方向和口径，不得重复追问。多个指标必须全部明确才算匹配，部分明确时confirmed保留已确认项，只追问有歧义的部分。
        以下别名视为等价：用户下行平均吞吐率=用户下行平均吞吐率(速率)。候选中同时存在平均吞吐率和总吞吐量且用户未明确口径时，必须追问。
        工参或配置查询中，只要字段名称和条件表达明确即可；属性值不要求出现在候选列表中，例如Band=LTE1800、带宽=5M、电子下倾角=5、配置状态=ON均可视为完整。用户提到LTE1800、LTE2100、LTE800等频段时，应规划使用Band字段筛选，不得自行推导EARFCN；“波束带宽”不得直接等同于Bandwidth，字段不明确时需要追问。

        # 二-B、黑话（alias）规则
        用户问题中可能包含5G黑话（非标准KPI说法），alias字段提供了黑话到标准KPI中文名的映射。如果用户问题原文中的某个表述与alias中某个key匹配（即该表述是黑话），则应在总体计划中用标准KPI名称替换该表述。
        一般地，用户语义没有指向性，则value列表中的所有标准KPI名称都必须完整、逐条替换黑话出现在计划的指标描述中，不应反复追问。如果用户语义有所特指，请从value列表中选择对应的标准KPI名称来替换。
        如果用户问题原文中的KPI表述不是黑话（即alias中无对应key），则按正常KPI映射规则处理。

        当前alias映射：
        {alias_display}

        # 三、object规则
        object只在required=true时判断。精确匹配结果已经明确对象类型和名称时必须直接采用，不得重新猜测或改成其他类型。具体名称必须完整存在于对应候选列表中；匹配时可以忽略字母大小写以及下划线、点号、连字符等分隔符差异，但其他字母和数字必须一致。禁止仅凭前缀或子串匹配，也禁止根据小区名称推导enodeb、根据enodeb推导站点或根据站点推导enodeb。
        用户未提及对象时默认查询全部对象，不追问：KPI、工参和配置查询默认“查询德国汉堡全部小区”，能耗查询默认“查询全部RRU”。用户通过工参条件、配置条件、区域、TopN或排序条件定义对象时，视为对象完整。用户说“某个小区”“某个基站”“指定RRU”等泛指对象，或者提供的具体名称不存在、拼写错误、只有前缀匹配时，必须追问并优先推荐相似候选。
        KPI工具以小区为单元。用户查询enodeb、站点或区域下的KPI时，object可以匹配成功，但计划必须先调用region_creation获取小区，再调用compute_cell_kpi。能耗工具以RRU为单元，支持enodeb、RRU和柜框槽号，不支持通过具体小区名称直接查询；用户指定具体小区查询能耗时，应追问对应enodeb或RRU标识，不得自行从小区名称推导enodeb。

        # 四、time规则
        time只在required=true时判断。KPI和能耗查询必须有明确时间；若当前问题及可用上下文中都没有时间，time.matched=false并追问，不得自行使用默认一周绕过协商。工参和配置查询不要求时间。
        用户只给日期时，按当天00:00至23:59处理；给出整点如17:00时，按17:00至17:59处理；0:00按00:00至00:59处理；未写年份默认2025年，未写月份默认2025年9月。昨天、前天、过去N小时、过去N天等相对时间按当前时间2025-09-22 00:00换算。晚上定义为18:00至次日00:00。时间统一输出为YYYY-mm-dd HH:MM。
        用户只给小时但没有日期、使用非整点分钟、时间格式非法，或者查询时间部分或全部超出数据库范围时，time.matched=false并说明原因。非首轮问题应继承上文已经确认且未被用户覆盖的时间，不得重复追问。

        # 五、可用工具
        1. 小区过滤工具，根据频段、带宽、经纬度、频点等工程参数信息，筛选出对应的小区或enodeb名称，或者指定小区或enodeb名称查询某些工参信息。返回满足条件的小区或enodeb name的文件路径。
        2. 网络性能指标汇聚工具，用于计算指定时间范围内的小区网络性能指标（KPI指标）的统计量（求和、均值）。支持按小区、日期或小时分组，支持排序，求TopN指标，并返回详细的统计结果。
        3. BTS能耗统计工具，查询指定时间范围内的BTS基站能耗统计量。支持按enodeb、RRU、日期或小时分组求和/求平均，支持排序，并计算最大/最小的前n。可以指定柜框槽号以及enodeb名称，或指定rruid来查询指定的能耗指标。
        4. 配置信息查询工具，查询小区的配置特性状态，或给定配置特性的开关状态查询对应的小区。请注意区分配置和工参信息。
        5. 绘图工具，根据用户要求和给定数据，绘制饼图、柱状图、x-y图等普通图像。可通过画图描述数据分布和变化趋势。
        6. 增益计算工具，计算增益值，适用于比较两个数值或两个表格中对应元素的增益情况，支持按增益率或增益量排序，求增益最高或最低的top_n。

        # 六、计划格式与注意事项
        仅在所有必要维度matched=true时生成plan，格式为"**总体计划：**\\n1. 调用xx工具，[业务任务描述]\\n2. 调用xx工具，[业务任务描述]"。每一步只描述工具名称和业务目标，禁止包含任何参数名、参数值、API格式或预期结果。
        总体计划的每个步骤中应该尽量保留用户问题中的关键信息。比如要查询的具体指标名称、按什么分组、求和还是求均值、是否排序、排序顺序、是否求top_n等信息。只保留用户问题中明确指定的信息。
        用户未提到的信息，禁止擅自添加。例如查询"上行业务数据量(流量)"等，未要求计算总和，则计划不能写"上行业务数据量(流量)总和"。
        无依赖的工具可以并行描述，有路径或结果依赖的工具必须按顺序规划。
        相同工具调用多次时，若查询连续时间或同一组对象，请适当合并为一个步骤（如连续三天的能耗查询应一次调用按日期分组）；若时间不连续或需要比较（如计算增益），则分开调用。
        排序和top_n必须与分组操作规划为一个步骤，禁止先求出分组结果再单独排序。
        涉及到小区过滤工具时，要将筛选条件之间的”与或”关系体现在步骤描述中。
        查询与某小区同站点的其他小区信息时，需要分步：先调用小区过滤工具得到该小区所在站点，再调用小区过滤工具得到站点下的所有小区，进而查询其他信息。
        所有业务结果必须来自工具真实返回，禁止模型计算KPI公式、估算数值或编造结果。用户未要求绘图时禁止调用draw_graphs，未要求增益时禁止调用calculate_gain。
        "按指标排序求top_n后再筛选"必须先调用KPI工具求top_n，再用结果传入小区过滤工具，顺序不能乱。
        当用户要求按两个维度（如时间+对象）分别列出结果时，单次工具调用只能按一个维度分组，因此需要按其中一个维度拆分为多次调用，每次调用按另一个维度分组。默认按时间拆分（对每个时间段分别调用工具，每次按对象分组），但如果语义上更强调对象维度则按对象拆分。例如"查询某几个小区在某两天的指标"，应分两次调用，每次查一天的数据并按小区分组。
        "查询指标a的总和和指标b"，提到总和时，两个指标都求总和，"查询指标a和指标b"，没有提到总和时，两个指标默认都求均值

        # 七、统计口径规则
        核心判断：用户要的是「一个聚合值」还是「每个小区各自多少」。「统计/均值/总和」暗示聚合，「列出/各小区」暗示逐小区。
        单次工具调用只能完成一种统计口径（总体均值、总体总和、分组均值、分组总和中的一种），多口径必须拆分为多次调用。
        跨天查询时，「每天/逐日/各天」按日期分别查询；「期间平均/累计/总共」才允许聚合。多维度（如时间+对象）需拆分为多次调用，默认按时间拆分。
        排序和top_n必须与分组操作合为一步，禁止先分组再单独排序。
        用户询问多个小区的指标时，且没有指明求均值或总和，需区分两种情况决定是否分组：①用户列举具体小区名，则按小区名分组；②用户通过工参条件筛选出小区，则整体求均值/总和，默认求均值。

        # 八、计划示例
        【示例1】：
        用户问题：9月15日上午9点，站点xx下，工参a为yy（不包含zz）的所有小区的abc指标均值是多少？
        系统确认信息：已确认enodeb名称为xx。
        总体计划：
        1. 调用小区过滤工具，筛选出enodeb名称为xx，且工参a为yy，且工参a不为zz的小区。
        2. 调用网络性能指标汇聚工具，计算2025-09-15 09:00时，步骤1中获取的所有小区的abc指标均值。

        【示例2】：
        用户问题：09-18相比前一天，xx指标增长量最高的小区是谁。
        总体计划：
        1. 调用网络性能指标汇聚工具，计算2025-09-18 00:00至2025-09-18 23:59期间小区xx指标的总和，按小区分组。
        2. 调用网络性能指标汇聚工具，计算2025-09-17 00:00至2025-09-17 23:59期间小区xx指标的总和，按小区分组。
        3. 调用增益计算工具，计算每个小区在9.18日相比9.17日的xx指标的增长量，并找出增长量最高的小区。

        【示例3】：
        用户问题：过去5小时中，RRUID为xxx的目标，其能耗最大值是多少？
        总体计划：
        1. 调用BTS能耗统计工具，查询2025-09-21 19:00到2025-09-21 23:59期间，RRUID为xxx的BTS能耗，按小时分组，降序排序取最大值。

        【示例4】：
        用户问题：小区a和小区b在9月20日的xx指标是多少？
        总体计划：
        1. 调用网络性能指标汇聚工具，查询2025-09-20 00:00到2025-09-20 23:59期间，小区名为a和b的xx指标，按小区分组。

        【示例5】：
        用户问题：统计工参a为abc的小区在9月20日的xx指标。
        总体计划：
        1. 调用小区过滤工具，筛选出工参a为abc的小区。
        1. 调用网络性能指标汇聚工具，计算2025-09-20 00:00到2025-09-20 23:59期间，步骤1中小区的xx指标均值。（不分组）

        【示例6】：
        用户问题：请统计xx工参为aa的小区在9月18日的yy指标均值，并找出该日yy指标最高的3个小区。
        总体计划：
        1. 调用小区过滤工具，筛选出xx工参为aa的小区。
        1. 调用网络性能指标汇聚工具，计算2025-09-18 00:00到2025-09-18 23:59期间，步骤一中小区的yy指标的均值。
        2. 调用网络性能指标汇聚工具，计算2025-09-18 00:00到2025-09-18 23:59期间，步骤一中小区的yy指标，按小区分组，降序排序取前3。

        【示例7】：
        用户问题：小区a和小区b在9月19日和9月20日这两天每天的xx指标分别是多少，按小区分组。
        总体计划：
        1. 调用网络性能指标汇聚工具，查询2025-09-19 00:00到2025-09-19 23:59期间，小区名为a和b的xx指标，按小区分组。
        2. 调用网络性能指标汇聚工具，查询2025-09-20 00:00到2025-09-20 23:59期间，小区名为a和b的xx指标，按小区分组。

        【示例8】：
        用户问题：查一下上行负载
        alias映射：上行负载 -> ["上行PRB利用率"]
        总体计划：
        1. 调用网络性能指标汇聚工具，查询上行PRB利用率。

        # 九、输出格式
        最终只能输出一个可被json.loads直接解析的JSON对象，不得输出Markdown代码块、注释、分析过程或JSON之外的文字：

        {{
          "nego": {{
            "feature": {{
              "required": true,
              "matched": true,
              "confirmed": ["指标或参数中文名"],
              "message": ""
            }},
            "object": {{
              "required": true,
              "matched": true,
              "confirmed": "对象确认语句",
              "message": ""
            }},
            "time": {{
              "required": true,
              "matched": true,
              "start_time": "YYYY-mm-dd HH:MM",
              "end_time": "YYYY-mm-dd HH:MM",
              "message": ""
            }}
          }},
          "plan": "总体计划文本，意图不完备时为空字符串",
          "message": "给用户的确认或追问信息"
        }}

        required和matched必须使用JSON布尔值。三个维度必须全部输出；required=false时matched=true，并将confirmed、start_time、end_time和该维度message置空。维度不匹配时，应在对应维度message中记录具体缺失项或推荐选项。任一必要维度matched=false时，plan必须为""，顶层message应合并所有未匹配维度的message，礼貌且简洁，末尾必须且只能保留一个<Finished>。全部必要维度matched=true时，plan必须非空，顶层message可输出“已确认您的查询意图，正在为您执行任务”，不得包含<Finished>。

        # 输入
        用户问题：{input_question}

        精确匹配结果：
        {exact_summary}

        指标候选：
        - KPI指标：{candidate_kpis}
        - 工参字段：{candidate_filters}
        - 配置参数：{candidate_configures}

        对象候选：
        - 小区名称：{prompt_cell_names[:10]}
        - enodeb名称：{prompt_enodeb_names[:10]}
        - 站点/基站名称：{prompt_site_names[:10]}
        - RRU标识：{prompt_rruid_names[:10]}

        时间信息：
        - 当前时间：2025-09-22 00:00
        - 数据库范围：2025-09-15 00:00至2025-09-22 00:00
        - 数据粒度：小时级
        - “全部小区”“全网”“当前区域”“该区域”默认指德国汉堡范围

        请严格依据以上规则处理，只输出一个JSON对象。
        """

        result = {
            "messages": [{"role": "user", "content": nego_planner_prompt}],
            "model": "deepseek-v3",
            "max_tokens": 10000,
            "temperature": 0.1,
            "top_p": 0.7,
            "chat_template_kwargs": {"enable_thinking": False},
            "enable_thinking": False,
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      classify_result: ${python_result}

  call_nego_plan_llm:
    type: restful
    description: 调用 LLM (协商规划) 通过 RESTful API
    next:
      parse_nego_planner:
        condition: ''
    inputs:
      api_name: "chat_completions"
      verify_ssl: "false"
      timeout: "120"
      model: ${classify_result.model}
      messages: ${classify_result.messages}
      max_tokens: ${classify_result.max_tokens}
      temperature: ${classify_result.temperature}
      top_p: ${classify_result.top_p}
      chat_template_kwargs: ${classify_result.chat_template_kwargs}
      enable_thinking: ${classify_result.enable_thinking}
    outputs:
      nego_planner_response: ${api_response}
      nego_planner_llm_output: ${api_response.choices[0].message.content}

  parse_nego_planner:
    type: python
    description: 解析协商规划结果
    next:
      display_nego:
        condition: ${nego_res == "need_nego"}
      init_tool_history:
        condition: ${nego_res == "intent_complete"}
    inputs:
      nego_planner_llm_output: ${nego_planner_llm_output}
      script: |-
        import json
        import re

        response = (
            nego_planner_llm_output
            if isinstance(nego_planner_llm_output, str)
            else json.dumps(nego_planner_llm_output, ensure_ascii=False)
        )

        def parse_json(text):
            # 优先直接解析
            try:
                result = json.loads(text)
                if isinstance(result, dict):
                    return result
            except Exception:
                pass

            # 尝试提取 Markdown 代码块
            match = re.search(
                r"```(?:json)?\s*(.*?)\s*```",
                text,
                re.DOTALL | re.IGNORECASE
            )
            if match:
                try:
                    result = json.loads(match.group(1))
                    if isinstance(result, dict):
                        return result
                except Exception:
                    pass

            # 从文本中的左花括号开始尝试解析嵌套 JSON
            decoder = json.JSONDecoder()
            for index, char in enumerate(text):
                if char == "{":
                    try:
                        result, _ = decoder.raw_decode(text[index:])
                        if isinstance(result, dict):
                            return result
                    except Exception:
                        pass

            return {}

        def to_bool(value):
            if isinstance(value, bool):
                return value
            if isinstance(value, str):
                return value.strip().lower() in ["true", "yes", "1"]
            return bool(value)

        def add_finished(message):
            message = re.sub(
                r"\s*<Finished>\s*",
                "",
                str(message or ""),
                flags=re.IGNORECASE
            ).strip()

            if not message:
                message = "您好，当前查询意图不完整，请补充缺失信息。"

            return message + "<Finished>"

        def remove_finished(message):
            return re.sub(
                r"\s*<Finished>\s*",
                "",
                str(message or ""),
                flags=re.IGNORECASE
            ).strip()

        parsed = parse_json(response)
        nego = parsed.get("nego", {}) if isinstance(parsed, dict) else {}

        intent_complete = bool(parsed)

        for name in ["feature", "object", "time"]:
            item = nego.get(name, {})
            required = to_bool(item.get("required", True))
            matched = to_bool(item.get("matched", False))

            if required and not matched:
                intent_complete = False

        plan = str(parsed.get("plan", "") or "").strip()
        message = str(parsed.get("message", "") or "").strip()

        # 意图完整但没有计划，也不允许继续执行
        if intent_complete and plan:
            nego_res = "intent_complete"
            message = remove_finished(message)

            if not message:
                message = "已确认您的查询意图，正在为您执行任务"
        else:
            nego_res = "need_nego"
            plan = ""
            message = add_finished(message)

        result = {
            "nego_res": nego_res,
            "plan": plan,
            "message": message
        }

        print(json.dumps(result, ensure_ascii=False))
    outputs:
      nego_res: ${python_result.nego_res}
      current_plan: ${python_result.plan}
      nego_show_user_content: ${python_result.message}

  # ── Display 节点 ──
  display_nego:
    type: display-content
    description: 展示单项协商追问
    next:
      end_node:
        condition: ''
    inputs:
      content: ${nego_show_user_content}
    outputs:
      fmsg: ${nego_show_user_content}
      output_parser:
        type: HTML

  # ── Executor 循环 ──
  init_tool_history:
    type: python
    description: 初始化工具调用历史为空列表，供 executor 循环使用
    inputs:
      script: |-
        import json
        result = {"loop_count": 0, "tool_history": []}
        print(json.dumps(result))
    outputs:
      loop_count: ${python_result.loop_count}
      tool_history: ${python_result.tool_history}
    next:
      build_exec_messages:
        condition: ''


        - items
        - total
        - offset
        - limit

    SharedMemorySummaryPage:
      type: object
      description: 共享记忆摘要分页输出
      properties:
        items:
          type: array
          description: 当前页条目
          items:
            $ref: '#/components/schemas/SharedMemorySummary'
        total:
          type: integer
          format: int64
          description: 匹配总数
        offset:
          type: integer
          format: int32
          description: 当前偏移
        limit:

  # ── 并行检索汇合 ──
  parallel_search_join:
    type: inclusive-gateway
    description: 等待8路检索完成
    next:
      postprocess:
        condition: ''
    inputs:
    outputs:
      smsg2: node join...;

  # ══════════════════════════════════════════════════════
  # ── 后处理：解析各分类检索结果，filter_by_type 防御，结构化输出 ──
  # ══════════════════════════════════════════════════════
  postprocess:
    type: python
    description: 后处理：解析各分类检索结果，精确匹配，生成结构化recall_result
    next:
      build_nego_plan_messages:
        condition: ''
    inputs:
      feature_data: ${feature_data}
      ep_data: ${ep_data}
      alarm_data: ${alarm_data}
      cell_data: ${cell_data}
      site_data: ${site_data}
      region_data: ${region_data}
      grid_data: ${grid_data}
      poi_data: ${poi_data}
      input_question: ${input_question}
      script: |-
        import json
        import re

        def _extract_hits(data):
            hits = []
            if not isinstance(data, list):
                return hits
            for item in data:
                if not isinstance(item, dict):
                    continue
                for c in item.get("content", []):
                    if not isinstance(c, dict):
                        continue
                    props = c.get("properties", {})
                    meta = props.get("metadata", {})
                    if not isinstance(meta, dict):
                        continue
                    hits.append({
                        "dimension": meta.get("dimension", ""),
                        "map": meta.get("map", ""),
                        "name": meta.get("name", ""),
                        "knowledge": props.get("knowledge", ""),
                    })
            return hits

        _pm_hits = _extract_hits(feature_data)
        _ep_hits = _extract_hits(ep_data)
        _alarm_hits = _extract_hits(alarm_data)
        _cell_hits = _extract_hits(cell_data)
        _site_hits = _extract_hits(site_data)
        _region_hits = _extract_hits(region_data)
        _grid_hits = _extract_hits(grid_data)
        _poi_hits = _extract_hits(poi_data)

        def safe_get(item, key):
            v = item.get(key, "")
            return str(v) if v is not None else ""

        def filter_by_type(items, type_name):
            return [x for x in items if safe_get(x, "dimension") == type_name]

        _pm_hits = filter_by_type(_pm_hits, "PM")
        _ep_hits = filter_by_type(_ep_hits, "EP")
        _alarm_hits = filter_by_type(_alarm_hits, "ALARM")
        _cell_hits = filter_by_type(_cell_hits, "CELL")
        _site_hits = filter_by_type(_site_hits, "SITE")
        _region_hits = filter_by_type(_region_hits, "REGION")
        _grid_hits = filter_by_type(_grid_hits, "GRID")
        _poi_hits = filter_by_type(_poi_hits, "POI")

        def remove_cn_en_spaces(text):
            text = re.sub(r"([\u4e00-\u9fff])\s+([a-zA-Z0-9])", r"\1\2", text)
            text = re.sub(r"([a-zA-Z0-9])\s+([\u4e00-\u9fff])", r"\1\2", text)
            return text

        def normalize_spaces(text):
            text = re.sub(r"\s+", " ", text).strip()
            text = remove_cn_en_spaces(text)
            return text

        def match_aliases(question):
            normalized = normalize_spaces(question)
            normalized = re.sub(r"([A-Za-z0-9])\s+(?=[A-Za-z0-9])", r"\1", normalized)
            normalized_upper = normalized.upper()

            alias_5g = {
                "覆盖": [
                    "基于话统的弱覆盖占比",
                    "基于MR的弱覆盖占比",
                    "重叠覆盖率"
                ],
                "视频通话": [
                    "VINR接通率",
                    "VINR掉话率",
                    "VINR上行丢包率"
                ],
                "下行": [
                    "上下行低速占比",
                    "平均下行速率",
                    "RLC层下行丢包率",
                    "下行PRB利用率",
                    "下行流量",
                    "小区RLC层下行丢包率"
                ],
                "上行": [
                    "平均上行速率",
                    "上行平均干扰电平",
                    "VONR上行丢包率",
                    "上行PRB利用率",
                    "上行流量",
                    "VINR上行丢包率",
                    "5G上下行低速率占比"
                ],
                "语音通话": [
                    "EPSFB成功率",
                    "VoNR到VoLTE切换出成功率",
                    "VONR接通率",
                    "VONR掉话率",
                    "VONR上行丢包率",
                    "RLC层下行丢包率"
                ],
                "5G基础kpi": [
                    "NR到LTE切换出成功率",
                    "切换出成功率",
                    "无线掉话率",
                    "无线接通率"
                ],
                "速率": [
                    "平均下行速率",
                    "平均上行速率"
                ],
                "干扰": [
                    "上行平均干扰电平"
                ],
                "系统间切换": [
                    "VoNR到VoLTE切换出成功率",
                    "NR到LTE切换出成功率"
                ],
                "切换": [
                    "EPSFB成功率",
                    "VoNR到VoLTE切换出成功率",
                    "NR到LTE切换出成功率",
                    "切换出成功率"
                ],
                "接通": [
                    "VONR接通率",
                    "无线接通率",
                    "VINR接通率"
                ],
                "掉线": [
                    "VONR掉话率",
                    "切换出成功率"
                ],
                "负载": [
                    "上行PRB利用率",
                    "下行PRB利用率",
                    "CCE利用率"
                ],
                "流量": [
                    "下行流量",
                    "上行流量"
                ],
                "丢包": [
                    "RLC层下行丢包率"
                ],
                "上行负载": [
                    "上行PRB利用率"
                ],
                "下行负载": [
                    "下行PRB利用率"
                ],
                "VoNR掉话率": [
                    "VONR掉话率"
                ],
                "5G下行平均速率": [
                    "平均下行速率"
                ],
                "5G上行平均速率": [
                    "平均上行速率"
                ]
            }
            sorted_keys = sorted(alias_5g.keys(), key=lambda k: len(k), reverse=True)
            all_matched = [k for k in sorted_keys if k.upper() in normalized_upper]
            filtered = []
            for k in all_matched:
                is_substring = any(
                    k in other and k != other
                    for other in all_matched
                )
                if not is_substring:
                    filtered.append(k)
            matched_values = []
            for key in filtered:
                flag = 0
                for value in alias_5g[key]:
                    if value.upper() in normalized_upper:
                        flag = 1
                        break
                if flag:
                    continue
                matched_values.append({
                    "key": key,
                    "value": alias_5g[key]
                })
            return matched_values

        def normalize_symbol_match(match):
            return re.sub(r"[.\-()]+", "_", match.group()).strip("_")

        SYMBOL_PATTERN = re.compile(
            r"(?<![A-Za-z0-9_])"
            r"(?=[A-Za-z0-9_.()\-]*[.\-()])"
            r"[A-Za-z0-9_.()\-]+"
            r"(?![A-Za-z0-9_])"
        )

        def preprocess_str(text):
            if text is None:
                return ""
            text = str(text)
            text = remove_cn_en_spaces(text)
            text = SYMBOL_PATTERN.sub(normalize_symbol_match, text)
            return text.lower()

        def build_exact_matches(raw_values, processed_query):
            exact = []
            seen = set()
            for value in raw_values:
                value = str(value)
                if not value:
                    continue
                if preprocess_str(value) in processed_query and value not in seen:
                    exact.append(value)
                    seen.add(value)
            return exact

        def dedupe_keep_order(lst):
            seen = set()
            result = []
            for item in lst:
                if item not in seen:
                    seen.add(item)
                    result.append(item)
            return result

        joined_question = input_question
        joined_question_processed = preprocess_str(joined_question)

        top_related_pms = [safe_get(x, "knowledge") for x in _pm_hits if safe_get(x, "knowledge")][:50]
        top_related_eps = [safe_get(x, "knowledge") for x in _ep_hits if safe_get(x, "knowledge")][:50]
        top_related_alarms = [safe_get(x, "knowledge") for x in _alarm_hits if safe_get(x, "knowledge")][:50]

        raw_cell_names = [safe_get(x, "knowledge") for x in _cell_hits if safe_get(x, "knowledge")][:50]
        raw_site_names = [safe_get(x, "knowledge") for x in _site_hits if safe_get(x, "knowledge")][:50]
        raw_region_names = [safe_get(x, "knowledge") for x in _region_hits if safe_get(x, "knowledge")][:50]
        raw_grid_names = [safe_get(x, "knowledge") for x in _grid_hits if safe_get(x, "knowledge")][:50]
        raw_poi_names = [safe_get(x, "knowledge") for x in _poi_hits if safe_get(x, "knowledge")][:50]

        exact_features = build_exact_matches(top_related_pms + top_related_eps + top_related_alarms, joined_question_processed)

        # 黑话匹配：将alias对应的value（标准KPI名）追加到exact_features，使协商器判定feature完备
        alias_matched = match_aliases(input_question)
        alias_values = [v for a in alias_matched for v in a["value"]]
        exact_features = dedupe_keep_order(exact_features + alias_values)

        exact_cell = build_exact_matches(raw_cell_names, joined_question_processed)
        exact_site = build_exact_matches(raw_site_names, joined_question_processed)
        exact_region = build_exact_matches(raw_region_names, joined_question_processed)
        exact_grid = build_exact_matches(raw_grid_names, joined_question_processed)
        exact_poi = build_exact_matches(raw_poi_names, joined_question_processed)

        recall_result = {
            "candidate_pms": top_related_pms[:50],
            "candidate_eps": top_related_eps[:50],
            "candidate_alarms": top_related_alarms[:50],
            "candidate_features": dedupe_keep_order(top_related_pms[:20] + top_related_eps[:20] + top_related_alarms[:20] + alias_values),
            "exact_features": exact_features,
            "prompt_cell_names": raw_cell_names[:20],
            "prompt_site_names": raw_site_names[:20],
            "prompt_region_names": raw_region_names[:20],
            "prompt_grid_names": raw_grid_names[:20],
            "prompt_poi_names": raw_poi_names[:20],
            "exact_cell": exact_cell,
            "exact_site": exact_site,
            "exact_region": exact_region,
            "exact_grid": exact_grid,
            "exact_poi": exact_poi,
            "alias": alias_matched,
        }

        print(json.dumps(recall_result, ensure_ascii=False))
    outputs:
      recall_result: ${python_result}

  # ══════════════════════════════════════════════════════
  # ── 协商+规划 LLM（单次调用，无时间协商） ──
  # ══════════════════════════════════════════════════════
  build_nego_plan_messages:
    type: python
    description: 构建协商规划 LLM 的 messages 和调用参数（feature+object 两维度）
    next:
      call_nego_plan_llm:
        condition: ''
    inputs:
      input_question: ${input_question}
      recall_result: ${recall_result}
      script: |-
        import json

        candidate_pms = recall_result.get('candidate_pms', [])[:50]
        candidate_eps = recall_result.get('candidate_eps', [])[:50]
        candidate_alarms = recall_result.get('candidate_alarms', [])[:50]

        exact_features = recall_result.get('exact_features', [])
        alias_info = recall_result.get('alias', [])

        prompt_cell_names = recall_result.get('prompt_cell_names', [])[:20]
        prompt_site_names = recall_result.get('prompt_site_names', [])[:20]
        prompt_region_names = recall_result.get('prompt_region_names', [])[:20]
        prompt_grid_names = recall_result.get('prompt_grid_names', [])[:20]
        prompt_poi_names = recall_result.get('prompt_poi_names', [])[:20]

        exact_cell = recall_result.get('exact_cell', [])
        exact_site = recall_result.get('exact_site', [])
        exact_region = recall_result.get('exact_region', [])
        exact_grid = recall_result.get('exact_grid', [])
        exact_poi = recall_result.get('exact_poi', [])

        exact_summary = {
          "feature": exact_features,
          "cell": exact_cell,
          "site": exact_site,
          "region": exact_region,
          "grid": exact_grid,
          "poi": exact_poi,
        }

        alias_display = ""
        if alias_info:
            alias_lines = [f'  "{a["key"]}" -> {json.dumps(a["value"], ensure_ascii=False)}' for a in alias_info]
            alias_display = "\n".join(alias_lines)

        planner_prompt = f"""# 任务
        你是无线网络问数系统的意图协商与任务规划智能体。请结合用户问题、精确匹配结果和候选列表，判断feature和object两个维度是否完备，并生成后续工具执行计划。任一必要维度不完备时，只输出一次性追问，不生成计划；全部完备时，输出确认信息和总体计划。禁止输出分析过程或虚构数据。

        # 一、协商维度
        系统需要feature和object两个维度均完备才能执行。feature维度判断用户需要查询的指标或参数；object维度判断用户要查询的对象范围。两个维度都required=true，任一matched=false时，plan必须为空字符串，message合并所有缺失项并以一个<Finished>结尾；全部matched=true时，plan必须非空，message只做简洁确认且不得包含<Finished>。

        # 二、feature规则
        精确匹配结果优先级最高，已经精确识别的指标必须直接采用；候选列表仅用于辅助判断和推荐。用户明确说出具体且无歧义的指标，即使候选中没有完全相同的名称，也应matched=true。用户使用宽泛表达且候选中存在多个口径时，必须matched=false并推荐2至3个相关选项。PM指标、EP评估参数和ALARM告警分属不同类型，禁止跨类型匹配。用户查询PM性能指标时只使用PM候选，查询EP评估参数时只使用EP候选，查询告警时只使用ALARM候选。多个指标必须全部明确才算匹配。

        # 二-B、黑话（alias）规则
        用户问题中可能包含5G黑话（非标准KPI说法），alias字段提供了黑话到标准KPI中文名的映射。如果用户问题原文中的某个表述与alias中某个key匹配（即该表述是黑话），则应在总体计划中用标准KPI名称替换该表述。
        一般地，用户语义没有指向性，则value列表中的所有标准KPI名称都必须完整、逐条替换黑话出现在计划的指标描述中，不应反复追问。如果用户语义有所特指，请从value列表中选择对应的标准KPI名称来替换。
        如果用户问题原文中的KPI表述不是黑话（即alias中无对应key），则按正常KPI映射规则处理。

        当前alias映射：
        {alias_display}

        # 三、object规则
        精确匹配结果已经明确对象类型和名称时必须直接采用。具体名称必须完整存在于对应候选列表中；匹配时可以忽略字母大小写以及下划线、点号、连字符等分隔符差异，但其他字母和数字必须一致。禁止仅凭前缀或子串匹配。

        对象类型包括：CELL（小区）、SITE（站点）、REGION（区域）、GRID（网格）、POI（兴趣点）。用户未提及对象时默认查询全部对象，不追问。用户通过条件定义对象时，视为对象完整。用户说"某个小区""某个站点"等泛指对象，或者提供的具体名称不存在时，必须追问并优先推荐相似候选。

        # 四、工具与路由
        可用工具为query_pm（PM性能指标查询）、query_param（工参查询）、query_alarm（告警查询）、calculate_gain（增益计算）和smartcanvas（画图）。

        PM指标查询使用query_pm；工参筛选或查询使用query_param；告警查询使用query_alarm；比较两个时间段的增长量/率时，先分别查询两个时间段，再调用calculate_gain；仅在用户有明确画图意图（如折线图、柱状图、饼图等）或用户明确要求渲染大数据量（如超过前台默认渲染能力）时，在查询成功后调用smartcanvas。

        所有业务结果必须来自工具真实返回，禁止模型计算公式、估算数值或编造结果。计划只描述工具和业务任务，不输出命令或参数格式。

        # 五、计划格式
        仅在所有必要维度matched=true时生成plan，格式为"1. 调用工具名，完成具体任务。\\n2. ..."。每一步必须保留用户要求的指标、对象等关键口径；用户未提出的查询内容不得增加。无依赖的工具可以并行描述，有依赖的工具必须按顺序规划。

        # 六、示例
        【示例1】：
        用户问题：查一下上行负载
        alias映射：上行负载 -> ["上行PRB利用率"]
        总体计划：
        1. 调用query_pm，查询上行PRB利用率。

        # 七、输出格式
        最终只能输出一个可被json.loads直接解析的JSON对象，不得输出Markdown代码块、注释、分析过程或JSON之外的文字：

        {{
          "nego": {{
            "feature": {{
              "matched": true,
              "confirmed": ["指标名称"],
              "message": ""
            }},
            "object": {{
              "matched": true,
              "confirmed": "对象确认语句",
              "message": ""
            }}
          }},
          "plan": "总体计划文本，意图不完备时为空字符串",
          "message": "给用户的确认或追问信息"
        }}

        matched必须使用JSON布尔值。两个维度必须全部输出。维度不匹配时，应在对应维度message中记录具体缺失项或推荐选项。任一维度matched=false时，plan必须为""，顶层message应合并所有未匹配维度的message，礼貌且简洁，末尾必须且只能保留一个<Finished>。全部维度matched=true时，plan必须非空，顶层message可输出"已确认您的查询意图，正在为您执行任务"，不得包含<Finished>。

        # 输入
        用户问题：{input_question}

        精确匹配结果：
        {exact_summary}

        指标候选：
        - PM指标：{candidate_pms}
        - EP评估参数：{candidate_eps}
        - ALARM告警：{candidate_alarms}

        对象候选：
        - 小区名称：{prompt_cell_names}
        - 站点名称：{prompt_site_names}
        - 区域名称：{prompt_region_names}
        - 网格名称：{prompt_grid_names}
        - POI名称：{prompt_poi_names}

        请严格依据以上规则处理，只输出一个JSON对象。
        """

        result = {
            "messages": [{"role": "user", "content": planner_prompt}],
            "model": "deepseek-r1",
            "max_tokens": 10000,
            "temperature": 0.1,
            "top_p": 0.7,
            "chat_template_kwargs": {"enable_thinking": False},
            "enable_thinking": False,
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      classify_result: ${python_result}

  call_nego_plan_llm:
    type: restful
    description: 调用 LLM (协商规划) 通过 RESTful API
    next:
      parse_nego_planner:
        condition: ''
    inputs:
      api_name: "chat_completions"
      verify_ssl: "false"
      timeout: "120"
      model: ${classify_result.model}
      messages: ${classify_result.messages}
      max_tokens: ${classify_result.max_tokens}
      temperature: ${classify_result.temperature}
      top_p: ${classify_result.top_p}
      chat_template_kwargs: ${classify_result.chat_template_kwargs}
      enable_thinking: ${classify_result.enable_thinking}
    outputs:
      classify_response: ${api_response}
      classify_llm_output: ${api_response.choices[0].message.content}

  parse_nego_planner:
    type: python
    description: 解析协商规划结果（feature+object两维度，无时间）
    next:
      display_nego:
        condition: ${nego_res == "need_nego"}
      init_tool_history:
        condition: ${nego_res == "intent_complete"}
    inputs:
      classify_llm_output: ${classify_llm_output}
      script: |-
        import json
        import re

        response = (
            classify_llm_output
            if isinstance(classify_llm_output, str)
            else json.dumps(classify_llm_output, ensure_ascii=False)
        )

        def parse_json(text):
            try:
                result = json.loads(text)
                if isinstance(result, dict):
                    return result
            except Exception:
                pass
            match = re.search(r"```(?:json)?\s*(.*?)\s*```", text, re.DOTALL | re.IGNORECASE)
            if match:
                try:
                    result = json.loads(match.group(1))
                    if isinstance(result, dict):
                        return result
                except Exception:
                    pass
            decoder = json.JSONDecoder()
            for index, char in enumerate(text):
                if char == "{":
                    try:
                        result, _ = decoder.raw_decode(text[index:])
                        if isinstance(result, dict):
                            return result
                    except Exception:
                        pass
            return {}

        def to_bool(value):
            if isinstance(value, bool):
                return value
            if isinstance(value, str):
                return value.strip().lower() in ["true", "yes", "1"]
            return bool(value)

        def add_finished(message):
            message = re.sub(r"\s*<Finished>\s*", "", str(message or ""), flags=re.IGNORECASE).strip()
            if not message:
                message = "您好，当前查询意图不完整，请补充缺失信息。"
            return message + "<Finished>"

        def remove_finished(message):
            return re.sub(r"\s*<Finished>\s*", "", str(message or ""), flags=re.IGNORECASE).strip()

        parsed = parse_json(response)
        nego = parsed.get("nego", {}) if isinstance(parsed, dict) else {}

        intent_complete = bool(parsed)

        for name in ["feature", "object"]:
            item = nego.get(name, {})
            required = to_bool(item.get("required", True))
            matched = to_bool(item.get("matched", False))
            if required and not matched:
                intent_complete = False

        plan = str(parsed.get("plan", "") or "").strip()
        message = str(parsed.get("message", "") or "").strip()

        if intent_complete and plan:
            nego_res = "intent_complete"
            message = remove_finished(message)
            if not message:
                message = "已确认您的查询意图，正在为您执行任务"
        else:
            nego_res = "need_nego"
            plan = ""
            message = add_finished(message)

        result = {
            "nego_res": nego_res,
            "plan": plan,
            "message": message
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      nego_res: ${python_result.nego_res}
      current_plan: ${python_result.plan}
      nego_show_user_content: ${python_result.message}

  # ── Display 节点 ──
  display_nego:
    type: display-content
    description: 展示协商追问
    next:
      end_node:
        condition: ''
    inputs:
      content: ${nego_show_user_content}
    outputs:
      fmsg: ${nego_show_user_content}
      output_parser:
        type: HTML

  # ══════════════════════════════════════════════════════
  # ── Executor 循环 ──
  # ══════════════════════════════════════════════════════
  init_tool_history:
    type: python
    description: 初始化工具调用历史为空列表，供 executor 循环使用
    inputs:
      script: |-
        import json
        result = {"loop_count": 0, "tool_history": []}
        print(json.dumps(result))
    outputs:
      loop_count: ${python_result.loop_count}
      tool_history: ${python_result.tool_history}
    next:
      build_exec_messages:
        condition: ''

  build_exec_messages:
    type: python
    description: 构建统一的 executor prompt 和 LLM 调用参数（含工具调用历史）
    inputs:
      current_plan: ${current_plan}
      input_question: ${input_question}
      nego_show_user_content: ${nego_show_user_content}
      tool_history: ${tool_history}
      loop_count: ${loop_count}
      candidate_pms: ${recall_result.candidate_pms}
      candidate_eps: ${recall_result.candidate_eps}
      candidate_alarms: ${recall_result.candidate_alarms}
      candidate_alias: ${recall_result.alias}
      param_to_json_str: "true"
      script: |-
        import json

        tool_history = json.loads(tool_history)
        candidate_pms = json.loads(candidate_pms)
        candidate_eps = json.loads(candidate_eps)
        candidate_alarms = json.loads(candidate_alarms)
        candidate_alias = json.loads(candidate_alias)

        cur_task = input_question
        confirm_info = nego_show_user_content if nego_show_user_content else ''

        openai_tool_schema1 = {
            "type": "function",
            "function": {
                "name": "query_pm",
                "description": "PM性能指标查询工具。查询指定时间范围内的小区或站点PM性能指标统计量。支持按小区、站点或日期分组，支持排序和TopN。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "dimension": {
                            "type": "string",
                            "description": "查询维度。CELL表示按小区查询，SITE表示按站点查询。默认CELL。",
                            "enum": ["CELL", "SITE"]
                        },
                        "entityNames": {
                            "type": "array",
                            "description": "查询对象名称列表（小区名或站点名，取决于dimension）。如果未指定，则为空列表。",
                            "items": {"type": "string"}
                        },
                        "startTime": {
                            "type": "string",
                            "description": "起始时间，格式YYYY-MM-DD HH:mm:ss"
                        },
                        "endTime": {
                            "type": "string",
                            "description": "结束时间，格式YYYY-MM-DD HH:mm:ss"
                        },
                        "metrics": {
                            "type": "array",
                            "description": "需要查询的PM性能指标名称列表，名称需与PM指标名称对照表完全一致。如果未指定，则默认为空列表。",
                            "items": {"type": "string"}
                        },
                        "timePeriod": {
                            "type": "string",
                            "description": "时间粒度。可选值：15MIN、HOUR、DAY。默认15MIN。",
                            "enum": ["15MIN", "HOUR", "DAY"]
                        },
                        "groupBy": {
                            "type": "string",
                            "description": "分组方式。可选值：CELL（按小区分组）、SITE（按站点分组）、DATE（按日期分组）、HOUR（按小时分组）、不填（不分组）。默认不填。",
                            "enum": ["CELL", "SITE", "DATE", "HOUR"]
                        },
                        "aggregation": {
                            "type": "string",
                            "description": "聚合方式。可选值：sum（求和）、average（平均值）。默认average。",
                            "enum": ["sum", "average"]
                        },
                        "orderBy": {
                            "type": "string",
                            "description": "排序方式。可选值：Desc（降序）、Asc（升序）、不填（不排序）。默认不填。",
                            "enum": ["Desc", "Asc"]
                        },
                        "topN": {
                            "type": "integer",
                            "description": "返回TopN数量。如果不限制，不填写。"
                        },
                    },
                    "required": ["dimension", "startTime", "endTime", "metrics"],
                    "additionalProperties": False,
                }
            }
        }

        openai_tool_schema2 = {
            "type": "function",
            "function": {
                "name": "query_param",
                "description": "工参查询工具。根据工参条件筛选小区或站点，查询工参信息。返回满足条件的对象列表。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "dimension": {
                            "type": "string",
                            "description": "查询维度。CELL表示查询小区工参，SITE表示查询站点工参。默认CELL。",
                            "enum": ["CELL", "SITE"]
                        },
                        "entityNames": {
                            "type": "array",
                            "description": "查询对象名称列表（小区名或站点名，取决于dimension）。如果未指定，则为空列表。",
                            "items": {"type": "string"}
                        },
                        "ratTypes": {
                            "type": "array",
                            "description": "制式列表。可选值：NR、LTE。默认NR。",
                            "items": {"type": "string", "enum": ["NR", "LTE"]}
                        },
                        "fields": {
                            "type": "array",
                            "description": "要查询的工参字段名称列表，应填入英文列名。如果未指定，默认为空列表。",
                            "items": {"type": "string"}
                        },
                    },
                    "required": [],
                    "additionalProperties": False,
                }
            }
        }

        openai_tool_schema3 = {
            "type": "function",
            "function": {
                "name": "query_alarm",
                "description": "告警查询工具。查询指定维度和对象的告警信息，支持按告警级别、告警类别和时间段过滤。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "dimension": {
                            "type": "string",
                            "description": "查询维度，必填。REGION表示按区域查询，SITE表示按站点查询。",
                            "enum": ["REGION", "SITE"]
                        },
                        "entityNames": {
                            "type": "array",
                            "description": "查询对象名称列表（区域名或站点名，取决于dimension）。如果未指定，则为空列表。",
                            "items": {"type": "string"}
                        },
                        "alarmCategories": {
                            "type": "array",
                            "description": "告警类别列表。如果未指定，则查询所有类别。",
                            "items": {"type": "string"}
                        },
                        "severities": {
                            "type": "array",
                            "description": "告警级别列表，最大4项。可选值：1(紧急), 2(重要), 3(次要), 4(提示)。如果未指定，则查询所有级别。",
                            "items": {"type": "integer"}
                        },
                        "startTime": {
                            "type": "string",
                            "description": "起始时间，格式YYYY-MM-DD HH:mm:ss，默认当前时间-3天"
                        },
                        "endTime": {
                            "type": "string",
                            "description": "截止时间，格式YYYY-MM-DD HH:mm:ss，默认当前时间"
                        },
                        "dataPath": {
                            "type": "string",
                            "description": "数据文件路径。当entityNames为空时，从该路径读取对象列表。如果未指定，填空字符串。"
                        },
                    },
                    "required": ["dimension"],
                    "additionalProperties": False,
                }
            }
        }

        openai_tool_schema4 = {
            "type": "function",
            "function": {
                "name": "calculate_gain",
                "description": "增益计算工具。计算两个数值或两个表格中对应元素的增益情况，支持排序。通常在query_pm之后调用。不支持同比、环比或比值计算。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "pre_value_or_path": {
                            "type": "string",
                            "description": "基准值或基准数据路径。比较两个数值时输入基准数值；比较两个表格时输入较早时间点的数据文件路径。"
                        },
                        "post_value_or_path": {
                            "type": "string",
                            "description": "比较值或比较数据路径。比较两个数值时输入比较数值；比较两个表格时输入较晚时间点的数据文件路径。"
                        },
                        "input_type": {
                            "type": "string",
                            "description": "输入数据类型。'path'表示比较两个表格文件，'value'表示直接比较两个数值。",
                            "enum": ["path", "value"]
                        },
                        "object_type": {
                            "type": "string",
                            "description": "对象类型。SITE表示按站点维度计算增益，CELL表示按小区维度计算增益，REGION表示按区域维度计算增益。",
                            "enum": ["SITE", "CELL", "REGION"]
                        },
                    },
                    "required": ["pre_value_or_path", "post_value_or_path", "input_type", "object_type"],
                    "additionalProperties": False,
                }
            }
        }

        openai_tool_schema5 = {
            "type": "function",
            "function": {
                "name": "smartcanvas",
                "description": "智能画图工具。仅在用户有明确画图意图（如折线图、柱状图、饼图等）或用户明确要求渲染大数据量（如超过前台默认渲染能力）时使用。根据用户意图和已有数据生成可视化图表。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "userInput": {
                            "type": "string",
                            "description": "用户意图与查询结果的合并文本。格式为：用户问题 + '查询结果如下：' + 将数据以自然语言逐条描述。例如：'昨天上行PRB利用率最高的3个小区以及具体数值是多少。查询结果如下：HH1164_Hamburg_6_LG3 的上行PRB利用率为 61.2476；HH2614_Hamburg_U_Graumannsweg_118_LA3 的上行PRB利用率为 57.5335。'"
                        },
                        "response": {
                            "type": "object",
                            "description": "固定传空对象，即{\"code\":\"0\",\"message\":\"\",\"data\":{}}。数据内容已包含在userInput中，此处不再放数据。"
                        },
                    },
                    "required": ["userInput", "response"],
                    "additionalProperties": False,
                }
            }
        }

        openai_tool_schema = [openai_tool_schema1, openai_tool_schema2, openai_tool_schema3, openai_tool_schema4, openai_tool_schema5]

        _count = loop_count if isinstance(loop_count, int) else 0

        executor_system = f"""===== Executor规则 =====
        永远记住，您是executor，我是planner。切勿颠倒角色！切勿指导我！您必须利用您可用的工具解决我分配的任务。
        我将根据您的专长和我的需求提供任务的总体计划，总体计划分为多个步骤，您必须利用您可用的工具，逐步调用工具处理这些步骤，任务完成后，请简要总结。
        在总体计划的所有步骤全部处理结束之前，请不要中途停止，而是继续执行下一个步骤。
        总体计划的所有步骤完成后，应简要总结，要求：
        - 如果整体任务成功得到解决，只需简要总结任务处理结果即可。如果整体任务解决失败，需表明任务失败并简要分析失败原因。
        - 总结应简短精炼，直入主题，尽可能一两句话点明重点。
        - 如果工具执行结果是一个明确的结论加上表格展示，请直接以该结论为准；如果结论模糊或只有表格，你应该简练地总结表格中的关键信息，禁止直接重复该表格。
        - 如果工具执行结果是一个明确结论和一个结果保存路径，直接总结该结论即可，不必要复述文件路径；如果只有文件路径，请简单引入。
        - 工具调用结果中有确切数据的部分，将工具执行的参数和量化结果都加粗显示，结果路径不用加粗显示。

        【时间相关规则】
        如果工具的参数涉及时间，请根据我提供的时间信息进行填参，当前的时间是：2025年9月22日 0:00
        已知道信息： 2025年9月21日是星期天，9月22日是星期一。一个星期有7天。

        **请注意，以下是一些可能帮助您解决任务的提示：**
        <tips>
        - 请按照总体计划，调用计划中指定的工具，禁止调用其他工具。
        - 如果一种方式未能提供答案，请尝试其他方式或方法。
        - 不要过于自信您自己的知识。调用工具可以提供更专业的视角，并帮助验证现有知识。
        - 当工具运行失败时，永远不要假设它返回了正确的结果并继续基于这种假设进行推理。
        - 调用工具出现报错信息时，可以调整填参后重新尝试，最多3次，3次后仍未成功则视为失败，请立即停止运行，禁止死循环！
        - 每一步都需要确认参数，如果任务没有提到额外参数，或者提到的参数与工具现有的参数库不匹配，不用填参，使用默认参数。
        - 确保保留工具result返回结果的源格式。
        - 禁止编造结果路径，请严格根据工具执行结果给出回答。
        - 增益计算工具求减少率最高的top_n，即为求增益率最低的top_n，所以要注意填参时的排序顺序。
        - 当使用PM性能指标查询工具时，计划步骤中的指标名称可能不准确，请确保工具填参的指标名称与"PM指标名称对照表"中的名称完全一致。
        - 以下是PM指标名称对照表：{candidate_pms}
        - 以下是EP评估参数对照表：{candidate_eps}
        - 以下是ALARM告警名称对照表：{candidate_alarms}
        - 当使用告警查询工具时，dimension为必填字段；startTime和endTime格式为YYYY-MM-DD HH:mm:ss。
        - 当使用smartcanvas画图工具时，userInput必须包含用户问题+查询结果的完整数据描述，格式为：用户问题+'查询结果如下：'+逐条数据描述（如'小区A的指标为xx；小区B的指标为yy'）；response固定传{{"code":"0","message":"","data":{{}}}}，不要把数据放入response.data中。
        - 当计划中的指标名称来自alias映射时，请将alias.key对应的所有value（标准KPI中文名）完整传入metrics，禁止自行筛选或丢弃。以下是alias映射表：{candidate_alias}
        </tips>
        这是我们的整体任务：<task>{cur_task}</task>。永远不要忘记我们的任务！
        系统确认信息为：<confirm>{confirm_info}</confirm>

        当前需要执行的计划步骤：
        {current_plan}
        """

        _msgs = [{"role": "user", "content": executor_system}]
        _history = tool_history if isinstance(tool_history, list) else []
        for h in _history:
            step = h.get('step', '?')
            tname = h.get('tool_name', 'unknown')
            if isinstance(tname, str):
                tname = tname.strip('"')
            targs = h.get('tool_args', {})
            tresult = h.get('tool_result', {})
            args_display = {k: v for k, v in targs.items() if k != 'tool_name' and v is not None}
            _msgs.append({
                "role": "assistant",
                "content": None,
                "tool_calls": [{
                    "id": f"call_{step}",
                    "type": "function",
                    "function": {
                        "name": tname,
                        "arguments": json.dumps(args_display, ensure_ascii=False)
                    }
                }]
            })
            _msgs.append({
                "role": "tool",
                "tool_call_id": f"call_{step}",
                "content": json.dumps(tresult, ensure_ascii=False) if isinstance(tresult, (dict, list)) else str(tresult)
            })

        result = {
            "messages": _msgs,
            "tools": openai_tool_schema,
            "loop_count": _count,
            "model": "deepseek-v3",
            "max_tokens": 10000,
            "temperature": 0.1,
            "top_p": 0.8,
            "chat_template_kwargs": {"enable_thinking": False},
            "enable_thinking": False,
            "stream": True,
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      exec_result: ${python_result}
    next:
      call_exec_llm:
        condition: ''

  call_exec_llm:
    type: restful
    description: 调用 executor LLM
    inputs:
      api_name: "chat_completions"
      verify_ssl: "false"
      timeout: "120"
      model: ${exec_result.model}
      messages: ${exec_result.messages}
      max_tokens: ${exec_result.max_tokens}
      temperature: ${exec_result.temperature}
      top_p: ${exec_result.top_p}
      tools: ${exec_result.tools}
      tool_choice: "auto"
      chat_template_kwargs: ${exec_result.chat_template_kwargs}
      enable_thinking: ${exec_result.enable_thinking}
    outputs:
      exec_response: ${api_response}
      exec_llm_output: ${api_response.choices[0].message.content}
      exec_llm_tool_calls: ${api_response.choices[0].message.tool_calls}
    next:
      parse_exec_response:
        condition: ''

  parse_exec_response:
    type: python
    description: 解析 executor LLM 响应：从 tool_calls 提取工具调用参数，或取 content 作为直接回答
    inputs:
      exec_llm_output: ${exec_llm_output}
      exec_llm_tool_calls: ${exec_llm_tool_calls}
      script: |-
        import json
        tc = exec_llm_tool_calls
        if tc:
            if isinstance(tc, str):
                try:
                    tc = json.loads(tc)
                except Exception:
                    tc = None
        if tc and isinstance(tc, list) and len(tc) > 0:
            first = tc[0]
            if isinstance(first, dict):
                fn = first.get("function", {})
                n = fn.get("name", "")
                args_str = fn.get("arguments", "{}")
                try:
                    api_params = json.loads(args_str) if isinstance(args_str, str) else args_str
                except Exception:
                    api_params = {}
                args_lines = [f"- {k}: {v}" for k, v in api_params.items()]
                args_str_display = " ".join(args_lines)
                tool_display = f"> 执行工具 {n} | 参数: {args_str_display} "
                r = {
                    "exec_has_tool_call": "yes",
                    "exec_direct_answer": "",
                    "tool_name": n,
                    "tool_args": api_params,
                    "tool_display_text": tool_display,
                }
            else:
                r = {"exec_has_tool_call": "no", "exec_direct_answer": exec_llm_output if isinstance(exec_llm_output, str) else str(exec_llm_output), "tool_name": "", "tool_args": ""}
        else:
            r = {"exec_has_tool_call": "no", "exec_direct_answer": exec_llm_output if isinstance(exec_llm_output, str) else str(exec_llm_output), "tool_name": "", "tool_args": ""}
        print(json.dumps(r, ensure_ascii=False))
    outputs:
      exec_has_tool_call: ${python_result.exec_has_tool_call}
      exec_direct_answer: ${python_result.exec_direct_answer}
      tool_name: ${python_result.tool_name}
      tool_args: ${python_result.tool_args}
      tool_display_text: ${python_result.tool_display_text}
    next:
      display_exec_direct_answer:
        condition: ${exec_has_tool_call == "no"}
      route_tool:
        condition: ${exec_has_tool_call == "yes"}

  display_exec_direct_answer:
    type: display-content
    description: 展示 executor 的直接回答（无工具调用）
    inputs:
      content: ${exec_direct_answer}
    outputs:
      fmsg: ${exec_direct_answer}
      output_parser:
        type: HTML
    next:
      display_final_result:
        condition: ''

  # ── 工具路由（exclusive gateway）──
  route_tool:
    type: display-content
    description: 根据 tool_name 路由到对应工具的 restful 调用
    inputs:
    outputs:
      smsg2: dummy
    next:
      call_pm:
        condition: ${tool_name == "query_pm"}
      call_param:
        condition: ${tool_name == "query_param"}
      call_alarm:
        condition: ${tool_name == "query_alarm"}
      call_gain:
        condition: ${tool_name == "calculate_gain"}
      call_canvas:
        condition: ${tool_name == "smartcanvas"}

  # ── 1. PM 性能指标查询工具 ──
  call_pm:
    type: restful
    description: 调用 PM 性能指标查询 API（通过网关）
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "query_pm"
      api_yaml_path: "rest-unifieddataservice-performance.yaml"
      verify_ssl: "false"
      timeout: "120"
      model: "Qwen2.5-32B"
      dimension: ${tool_args.dimension}
      entityNames: ${tool_args.entityNames}
      dataPath: ${tool_args.dataPath}
      startTime: ${tool_args.startTime}
      endTime: ${tool_args.endTime}
      metrics: ${tool_args.metrics}
      timePeriod: ${tool_args.timePeriod}
      groupBy: ${tool_args.groupBy}
      aggregation: ${tool_args.aggregation}
      orderBy: ${tool_args.orderBy}
      topN: ${tool_args.topN}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 2. 工参查询工具 ──
  call_param:
    type: restful
    description: 调用工参查询 API（通过网关）
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "query_param"
      api_yaml_path: "rest-unifieddataservice-engineerparam.yaml"
      verify_ssl: "false"
      timeout: "600"
      model: "QwQ-32B"
      dimension: ${tool_args.dimension}
      entityNames: ${tool_args.entityNames}
      dataPath: ${tool_args.dataPath}
      ratTypes: ${tool_args.ratTypes}
      fields: ${tool_args.fields}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 3. 告警查询工具 ──
  call_alarm:
    type: restful
    description: 调用告警查询 API（通过网关）
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "query_alarm"
      api_yaml_path: "rest-services-alarm-query.yaml"
      verify_ssl: "false"
      timeout: "120"
      model: "Qwen3-32B"
      dimension: ${tool_args.dimension}
      entityNames: ${tool_args.entityNames}
      dataPath: ${tool_args.dataPath}
      alarmCategories: ${tool_args.alarmCategories}
      severities: ${tool_args.severities}
      startTime: ${tool_args.startTime}
      endTime: ${tool_args.endTime}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 4. 增益计算工具 ──
  call_gain:
    type: python
    description: 增益计算工具
    next:
      update_tool_history:
        condition: ''
    inputs:
      tool_name: ${tool_name}
      pre_value_or_path: ${tool_args.pre_value_or_path}
      post_value_or_path: ${tool_args.post_value_or_path}
      input_type: ${tool_args.input_type}
      object_type: ${tool_args.object_type}
      script: |-
        import json

        if input_type == "value":
            try:
                pre = float(pre_value_or_path)
                post = float(post_value_or_path)
                if pre == 0:
                    gain_rate = None
                else:
                    gain_rate = round((post - pre) / abs(pre) * 100, 4)
                tool_result = {
                    "code": 0,
                    "message": "增益计算完成",
                    "object_type": object_type,
                    "pre_value": pre,
                    "post_value": post,
                    "gain_rate": gain_rate,
                    "data": []
                }
            except (ValueError, TypeError):
                tool_result = {
                    "code": -1,
                    "message": "增益计算失败：输入值无法转为数值",
                    "object_type": object_type,
                    "data": []
                }
        else:
            tool_result = {
                "code": 0,
                "message": "增益计算完成（dummy结果，path模式暂不支持）",
                "object_type": object_type,
                "data": []
            }

        result = {"tool_result": tool_result, "tool_display_text": "增益计算"}
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      tool_result: ${python_result.tool_result}
      tool_display_text: ${python_result.tool_display_text}

  # ── 5. 智能画图工具 ──
  call_canvas:
    type: restful
    description: 调用智能画图 API（sseGenerateUI）
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "sseGenerateUI"
      verify_ssl: "false"
      timeout: "600"
      scenario: ${sc_scenario}
      userInput: ${sc_user_input}
      source: "watt"
      response: ${sc_response}
      title: ${sc_title}
      suggestion: ${sc_suggestion}
      templateId: ${sc_template_id}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  update_tool_history:
    type: python
    description: 将本次工具调用+结果追加到 tool_history，更新 loop_count
    inputs:
      tool_name: ${tool_name}
      tool_args: ${tool_args}
      tool_result: ${tool_result}
      loop_count: ${loop_count}
      tool_history: ${tool_history}
      current_plan: ${current_plan}
      param_to_json_str: "true"
      script: |-
        import json

        tool_args=json.loads(tool_args)
        tool_result=json.loads(tool_result)
        tool_history=json.loads(tool_history)

        _count = int(loop_count) if isinstance(loop_count, (int, str)) and str(loop_count).isdigit() else 0

        _count += 1
        _history = tool_history if isinstance(tool_history, list) else []
        _record = {
            "step": _count,
            "tool_name": tool_name,
            "tool_args": tool_args if isinstance(tool_args, dict) else {},
            "tool_result": tool_result if isinstance(tool_result, (dict, list)) else str(tool_result),
        }
        _new_history = _history + [_record]

        _reached_max = "yes" if _count >= 10 else "no"
        result = {
            "loop_count": _count,
            "tool_history": _new_history,
            "current_plan": current_plan,
            "reached_max_loop": _reached_max
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      loop_count: ${python_result.loop_count}
      tool_history: ${python_result.tool_history}
      current_plan: ${python_result.current_plan}
      reached_max_loop: ${python_result.reached_max_loop}
    next:
      display_max_loop_warning:
        condition: ${reached_max_loop == "yes"}
      build_exec_messages:
        condition: ${reached_max_loop == "no"}

  display_max_loop_warning:
    type: display-content
    description: 达到最大执行步数限制
    inputs:
      content: 已达到最大执行步数限制（10步），当前结果如下
    outputs:
      fmsg: 已达到最大执行步数限制（10步），当前结果如下
    next:
      display_final_result:
        condition: ''

  display_final_result:
    type: display-content
    description: 展示最终结果
    inputs:
      content: ${exec_direct_answer}
    outputs:
      fmsg: ${exec_direct_answer}
      output_parser:
        type: HTML
    next:
      end_node:
        condition: ''

  end_node:
    type: end-event
    description: 问答结束

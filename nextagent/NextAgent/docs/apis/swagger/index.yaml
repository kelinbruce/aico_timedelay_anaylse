swagger: '2.0'
info:
  title: NextAgent Web Channel API
  version: 1.0.0
  description: >-
    Public REST API surface for the NextAgent Web Channel. All endpoints are served under the `/api/v1` prefix unless
    noted otherwise (health endpoints use root paths). Authentication uses a cookie-based local auth flow for loopback
    deployments.
host: localhost:3000
basePath: /
schemes:
  - https
tags:
  - name: Runtime
    description: Runtime bootstrap and health endpoints
  - name: Auth
    description: Local authentication endpoints
  - name: Session
    description: Session lifecycle management
  - name: RequestCommand
    description: Request submission, cancel, retry, edit and pending-input
  - name: Stream
    description: Server-sent events stream
  - name: Conversation
    description: Conversation query, preview and event history
  - name: Annotation
    description: Run annotations and favorites
  - name: BackgroundTask
    description: Background task lifecycle
  - name: Share
    description: Session share creation and retrieval
  - name: Attachment
    description: File upload and temporary file management
  - name: Skill
    description: Skill catalog query
  - name: Question
    description: Category, frequent, association and pinned questions
  - name: Memory
    description: Long-term memory CRUD, search, publish and copy
  - name: CronTask
    description: Scheduled task lifecycle management and execution
  - name: SessionActivity
    description: Cross-session activity awareness stream and consumption
  - name: TaskChannel
    description: Task Channel stream, async, cancel, query and pending-input

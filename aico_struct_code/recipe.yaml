name: WATT_PLEX
description: RAG检索+协商+执行流程 - 三路并行检索dim_feature/dim_cell/dim_region（含PM/EP/ALARM），5工具（PM/工参/告警/增益/画图）
domain: WATT
scene: rag-retrieval
lang: zh
version: 0.0.1
type: boot-recipe

nodes:
  start_node:
    type: start-event
    description: 用户问题入口
    next:
      preprocess:
        condition: ''

  # ── 预处理 ──
  preprocess:
    type: python
    description: 预处理：清洗历史对话，构建查询文本
    next:
      parallel_search:
        condition: ''
    inputs:
      input_question: ${input_question}
      script: |-
        import re
        import json

        question = input_question
        chat_history_key = [{'role': 'user', 'content': question}]

        def remove_tool_call_blocks(text):
            if not text:
                return text
            text = re.sub(r"<think[\s\S]*?\<\/think>", "", text, flags=re.IGNORECASE)
            text = re.sub(r"###\s*🛠️\s*Tool\s*Call[\s\S]*?(?=###\s*🤖\s*Executor\s*Agent|###\s|\Z)", "", text, flags=re.IGNORECASE)
            text = re.sub(r">\s*已执行工具[\s\S]*?(?=###\s|\Z)", "", text, flags=re.IGNORECASE)
            text = re.sub(r"[ \t]+", " ", text)
            text = re.sub(r"\n{2,}", "\n\n", text)
            return text.strip()

        query = " ".join([remove_tool_call_blocks(k['content']) for k in chat_history_key])
        query += " " + question

        result = {
            "chat_history_key": chat_history_key,
            "query": query
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      chat_history_key: ${python_result.chat_history_key}
      query: ${python_result.query}

  # ══════════════════════════════════════════════════════
  # ── 并行7路 type-filtered RAG 检索 ──
  # ══════════════════════════════════════════════════════
  parallel_search:
    type: parallel-gateway
    description: 并行发起8路检索（PM/EP/ALARM/CELL/SITE/REGION/GRID/POI）
    next:
      build_search_feature_body:
        condition: ''
      build_search_ep_body:
        condition: ''
      build_search_alarm_body:
        condition: ''
      build_search_cell_body:
        condition: ''
      build_search_site_body:
        condition: ''
      build_search_region_body:
        condition: ''
      build_search_grid_body:
        condition: ''
      build_search_poi_body:
        condition: ''
    inputs:
      join_timeout: "120"
      join_node: "parallel_search_join"

  # ── 1. Feature 检索（PM + EP） ──
  build_search_feature_body:
    type: python
    description: 构建dim_feature索引搜索请求体（PM+EP）
    next:
      search_feature:
        condition: ''
    inputs:
      input_question: ${input_question}
      script: |-
        import json
        body = {
            "query": input_question,
            "max_num_results": 50,
            "ranking_options": {"ranker": "merge"},
            "termweight_options": {"termweighter": "none", "topn": 3},
            "search_strategies": [{"strategy": "text", "top_k": 50}],
            "filters": {"type": "and", "filters": [{"key": "metadata.dimension", "value": "PM", "type": "equals"}]},
        }
        print(json.dumps(body, ensure_ascii=False))
    outputs:
      feature_body: ${python_result}

  search_feature:
    type: restful
    description: 检索dim_feature索引中type=PM的数据
    next:
      parallel_search_join:
        condition: ''
    inputs:
      api_name: "search_dim_feature"
      verify_ssl: "false"
      query: ${feature_body.query}
      max_num_results: ${feature_body.max_num_results}
      ranking_options: ${feature_body.ranking_options}
      termweight_options: ${feature_body.termweight_options}
      search_strategies: ${feature_body.search_strategies}
      filters: ${feature_body.filters}
    outputs:
      feature_response: ${api_response}
      feature_data: ${api_response.data}
      output_parser:
        show_title: false
        show_content: false

  # ── 2. Feature EP 检索 ──
  build_search_ep_body:
    type: python
    description: 构建dim_feature索引搜索请求体（EP）
    next:
      search_ep:
        condition: ''
    inputs:

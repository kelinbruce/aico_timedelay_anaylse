      input_question: ${input_question}
      script: |-
        import json
        import re

        DATABASE_START = "2025-09-15 00:00"
        DATABASE_END = "2025-09-22 00:00"
        CURRENT_TIME = "2025-09-22 00:00"

        def _extract_hits(data):
            hits = []
            if not isinstance(data, list):
                return hits
            for item in data:
                if not isinstance(item, dict):
                    continue
                for c in item.get("content", []):
                    if not isinstance(c, dict):
                        continue
                    props = c.get("properties", {})
                    meta = props.get("metadata", {})
                    if not isinstance(meta, dict):
                        continue
                    hits.append({
                        "type": meta.get("type", ""),
                        "map": meta.get("map", ""),
                        "name": meta.get("name", ""),
                        "knowledge": props.get("knowledge", ""),
                    })
            return hits

        _kpi_hits = _extract_hits(kpi_data)
        _kpi_cn_hits = _extract_hits(kpi_cn_data)
        _filter_hits = _extract_hits(filter_data)
        _configure_hits = _extract_hits(configure_data)
        _cell_hits = _extract_hits(cell_data)
        _enodeb_hits = _extract_hits(enodeb_data)
        _rru_hits = _extract_hits(rru_data)
        _site_hits = _extract_hits(site_data)

        def safe_get(item, key):
            v = item.get(key, "")
            return str(v) if v is not None else ""

        def filter_by_type(items, type_name):
            return [x for x in items if safe_get(x, "type") == type_name]

        _kpi_hits = filter_by_type(_kpi_hits, "kpi")
        _kpi_cn_hits = filter_by_type(_kpi_cn_hits, "kpi")
        _filter_hits = filter_by_type(_filter_hits, "filter")
        _configure_hits = filter_by_type(_configure_hits, "configure")
        _cell_hits = filter_by_type(_cell_hits, "cell")
        _enodeb_hits = filter_by_type(_enodeb_hits, "enodeb")
        _rru_hits = filter_by_type(_rru_hits, "rru")
        _site_hits = filter_by_type(_site_hits, "site")

        def remove_cn_en_spaces(text):
            text = re.sub(r"([\u4e00-\u9fff])\s+([a-zA-Z0-9])", r"\1\2", text)
            text = re.sub(r"([a-zA-Z0-9])\s+([\u4e00-\u9fff])", r"\1\2", text)
            return text

        def normalize_symbol_match(match):
            return re.sub(r"[.\-()]+", "_", match.group()).strip("_")

        SYMBOL_PATTERN = re.compile(
            r"(?<![A-Za-z0-9_])"
            r"(?=[A-Za-z0-9_.()\-]*[.\-()])"
            r"[A-Za-z0-9_.()\-]+"
            r"(?![A-Za-z0-9_])"
        )

        def preprocess_str(text):
            if text is None:
                return ""
            text = str(text)
            text = remove_cn_en_spaces(text)
            text = SYMBOL_PATTERN.sub(normalize_symbol_match, text)
            return text.lower()

        def build_exact_matches(raw_values, processed_query):
            exact = []
            seen = set()
            for value in raw_values:
                value = str(value)
                if not value:
                    continue
                if preprocess_str(value) in processed_query and value not in seen:
                    exact.append(value)
                    seen.add(value)
            return exact

        def dedupe_keep_order(items):
          seen = set()
          result = []
          for item in items:
              if item not in seen:
                  seen.add(item)
                  result.append(item)
          return result

        def normalize_spaces(text):
            text = re.sub(r"\s+", " ", text).strip()
            text = remove_cn_en_spaces(text)
            return text

        def match_aliases(question):
            normalized = normalize_spaces(question)
            normalized = re.sub(r"([A-Za-z0-9])\s+(?=[A-Za-z0-9])", r"\1", normalized)
            normalized_upper = normalized.upper()

            alias_5g = {

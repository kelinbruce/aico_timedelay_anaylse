        - limit

    VersionedUpdateResult:
      type: object
      description: 版本化更新结果
      properties:
        status:
          type: string
          description: 版本化更新状态
          enum:
            - UPDATED
            - VERSION_CONFLICT
            - NOT_FOUND
        memoryId:
          type: string
          description: 更新的长期记忆 ID
        currentVersion:
          type: integer
          format: int64
          description: 更新后版本号
        record:
          $ref: '#/components/schemas/LongTermMemoryRecord'
      required:
        - status

    SaveLongTermMemoryReq:
      type: object
      description: 创建或更新长期记忆请求
      properties:
        memoryId:
          type: string
          description: 已存在时更新该 memory；省略或同 scope 不存在时创建新 memory
          minLength: 1
          maxLength: 64
        tenantId:
          type: string
          description: Owner Scope 租户
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: Owner Scope 用户
          minLength: 1
          maxLength: 64
        agentId:
          type: string
          description: Agent Scope
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9\-_]{1,64}$'
        memoryInstance:
          type: string
          description: 逻辑记忆空间，默认 defaultInstance
          default: defaultInstance
          minLength: 1
          maxLength: 64
        memoryType:
          $ref: '#/components/schemas/MemoryType'
        knowledgeSourceType:
          $ref: '#/components/schemas/KnowledgeSourceType'
        briefIndex:
          type: string
          description: L1 摘要
          minLength: 1
          maxLength: 2048
        content:
          type: string
          description: L2 结构化正文，JSON 字符串
          maxLength: 4000
        labels:
          type: array
          description: 标签
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 256
        confidence:
          type: number
          format: double
          description: 置信度 [0.0, 1.0]
          minimum: 0
          maximum: 1
        source:
          type: string
          description: 安全来源信息 JSON 字符串
          minLength: 1
          maxLength: 4096
        idempotencyKey:
          type: string
          description: POST create 去重键
          minLength: 1
          maxLength: 128
        expectedVersion:
          type: integer
          format: int64
          description: 已存在 memory 更新时使用的 CAS 版本
          minimum: 1
      required:
        - tenantId
        - userId
        - agentId
        - knowledgeSourceType
        - memoryType
        - briefIndex
        - content
        - confidence
        - source

    PatchLongTermMemoryReq:
      type: object
      description: 长期记忆字段级变更请求，单次请求只能包含一种字段组合
      properties:
        tenantId:
          type: string
          description: Owner Scope 租户
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: Owner Scope 用户
          minLength: 1
          maxLength: 64
        agentId:
          type: string
          description: Agent Scope
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9\-_]{1,64}$'
        memoryInstance:
          type: string
          description: 逻辑记忆空间
          minLength: 1
          maxLength: 64
        expectedVersion:
          type: integer
          format: int64
          description: CAS 版本
          minimum: 1
        targetState:
          $ref: '#/components/schemas/MemoryState'
        archiveReason:
          type: string
          description: 状态变更时填写，恢复时为空字符串
          minLength: 0
          maxLength: 128
        delta:
          type: number
          format: double
          description: 置信度增量
          minimum: -1
          maximum: 1
        lastAccessTime:
          type: integer
          format: int64
          description: 访问时间，epoch millis
          minimum: 0
        isPinned:
          type: boolean
          description: pin/unpin 时填写
      required:
        - tenantId
        - userId
        - agentId

    SearchLongTermMemoryReq:
      type: object
      description: 检索长期记忆请求
      properties:
        tenantId:
          type: string
          description: Owner Scope 租户
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: Owner Scope 用户
          minLength: 1
          maxLength: 64
        agentId:
          type: string
          description: Agent Scope
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9\-_]{1,64}$'
        memoryInstance:
          type: string
          description: 逻辑记忆空间
          minLength: 1
          maxLength: 64
        queryText:
          type: string
          description: 检索文本
          minLength: 1
          maxLength: 2048
        memoryType:
          $ref: '#/components/schemas/MemoryType'
        knowledgeSourceType:
          $ref: '#/components/schemas/KnowledgeSourceType'
        minConfidence:
          type: number
          format: double
          description: 置信度下界
          minimum: 0
          maximum: 1
        sinceTime:
          type: integer
          format: int64
          description: 创建时间下界，epoch millis
          minimum: 0
        untilTime:
          type: integer
          format: int64
          description: 创建时间上界，epoch millis
          minimum: 0
        labels:
          type: array
          description: 标签过滤
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 256
        limit:
          type: integer
          format: int32
          description: 页大小，上限 100
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int32
          description: 固定为 0；非 0 返回 LTM_QUERY_INVALID
          minimum: 0
      required:
        - tenantId
        - userId
        - agentId
        - queryText
        - minConfidence
        - limit
        - offset

    CopyLongTermMemoryReq:
      type: object
      description: 批量复制共享记忆请求
      properties:
        memoryIds:
          type: array
          description: 待复制的 SHARED memory ID 数组，单次最多 100 条
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 1
          maxItems: 100
        tenantId:
          type: string
          description: 接收者租户
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: 接收者用户
          minLength: 1
          maxLength: 64
        agentId:
          type: string
          description: 接收者 Agent Scope
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9\-_]{1,64}$'
        memoryInstance:
          type: string
          description: 接收者逻辑记忆空间
          minLength: 1
          maxLength: 64
        reasonCode:
          type: string
          description: 安全 reason code
          minLength: 1
          maxLength: 128
      required:
        - memoryIds
        - tenantId
        - userId
        - agentId

    CopyPublishedMemoryResult:
      type: object
      description: 单条复制结果
      properties:
        memoryId:
          type: string
          description: FORK memory ID
        record:
          $ref: '#/components/schemas/LongTermMemoryRecord'

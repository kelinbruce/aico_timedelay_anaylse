                        "statistics": {
                            "type": "string",
                            "description": "统计方法。可选值：'sum'（求和）、'average'（平均值）。如果未指定，则默认使用'average'。",
                            "enum": ["sum", "average"]
                        },
                        "sort_order": {
                            "type": "string",
                            "description": "排序方式。可选值：'Desc'（降序）、'Asc'（升序）、'None'（不排序）。如果问最大/最高的几个，填'Desc'；如果问最小/最低的几个，填'Asc'。如果未指定，则默认不排序，填'None'。",
                            "enum": ["Desc", "Asc", "None"]
                        },
                        "top_N": {
                            "type": "string",
                            "description": "需要返回的TopN数量，整数。如果未指定，则填写'None'。"
                        },
                    },
                    "required": ["start_time", "end_time", "kpi_array"],
                    "additionalProperties": False,
                    "returns": {
                        "type": "string",
                        "description": "返回小区网络性能指标的统计结果，包括：1）统计结果文件路径；2）小区总数；3）指标统计结果。"
                    }
                }
            }
        }

        openai_tool_schema5 = {
            "type": "function",
            "function": {
                "name": "calculate_gain",
                "description": "增益计算工具。计算增益值，适用于比较两个数值或两个表格中对应元素的增益情况，支持排序，求增益最高或最低的top_n，通常在网络指标汇聚工具或者BTS能耗统计工具之后调用此工具。注意：本工具不支持同比、环比等其他类型分析，也不支持求两个数据之间的比值（如部分占总体的百分比）。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "pre_value_or_path": {
                            "type": "string",
                            "description": "基准值或基准数据路径。当比较两个数值时，直接输入基准数值；当比较两个表格时，输入较早时间点的数据文件路径。"
                        },
                        "post_value_or_path": {
                            "type": "string",
                            "description": "比较值或比较数据路径。当比较两个数值时，直接输入比较数值；当比较两个表格时，输入较晚时间点的数据文件路径。"
                        },
                        "input_type": {
                            "type": "string",
                            "description": "输入数据类型。若比较两个表格文件，填写 'path'；若直接比较两个数值，填写 'value'。",
                            "enum": ["path", "value"]
                        },
                        "top_N": {
                            "type": "number",
                            "description": "当 input_type 为 'path' 时，指定显示前 N 个增益最高的样本，默认值为 3。"
                        },
                        "order": {
                            "type": "string",
                            "description": "当 input_type 为 'path' 时，指定排序方式。'Desc' 表示降序（增益从高到低），'ASC' 表示升序（增益从低到高），默认值为 'Desc'。",
                            "enum": ["Desc", "ASC"]
                        },
                    },
                    "required": ["pre_value_or_path", "post_value_or_path", "input_type"],
                    "additionalProperties": False,
                    "returns": {
                        "type": "string",
                        "description": "返回当前分析总结结果。"
                    }
                }
            }
        }

        openai_tool_schema6 = {
            "type": "function",
            "function": {
                "name": "draw_graphs",
                "description": "绘图工具。根据用户要求和给定数据，绘制饼图、柱状图、x-y图等普通图像。",
                "parameters": {
                    "type": "object",
                    "properties": {
                        "data_path": {
                            "type": "array",
                            "description": "路径的列表。其中每个路径都应该是完整路径，使用英文的逗号','隔开不同的路径。格式为：['路径1','路径2']"
                        },
                        "intent": {
                            "type": "string",
                            "description": "用户意图",
                        },
                        "graph_type": {
                            "type": "string",
                            "description": "用户指定的绘图类型，饼图，折线图",
                        }
                    },
                    "required": ["data_path", "intent"],
                    "additionalProperties": False,
                    "returns": {
                        "type": "string",
                        "description": "返回当前分析总结结果"
                    }
                }
            }
        }

        openai_tool_schema = [openai_tool_schema1, openai_tool_schema2, openai_tool_schema3, openai_tool_schema4, openai_tool_schema5, openai_tool_schema6]


        _count = loop_count if isinstance(loop_count, int) else 0

        executor_system = f"""===== Executor规则 =====
        永远记住，您是executor，我是planner。切勿颠倒角色！切勿指导我！您必须利用您可用的工具解决我分配的任务。我们共同关注的是合作成功完成一个复杂的任务。 
        我将根据您的专长和我的需求提供任务的总体计划，总体计划分为多个步骤，您必须利用您可用的工具，逐步调用工具处理这些步骤，任务完成后，请简要总结。
        在总体计划的所有步骤全部处理结束之前，请不要中途停止，而是继续执行下一个步骤。
        总体计划的所有步骤完成后，应简要总结，要求：
        - 如果整体任务成功得到解决，只需简要总结任务处理结果即可。如果整体任务解决失败，需表明任务失败并简要分析失败原因。
        - 总结应简短精炼，直入主题，尽可能一两句话点明重点。
        - 如果工具执行结果是一个明确的结论加上表格展示，请直接以该结论为准；如果结论模糊或只有表格，你应该简练地总结表格中的关键信息，**禁止直接重复该表格**。
        - 如果工具执行结果是一个明确结论和一个结果保存路径，直接总结该结论即可，不必要复述文件路径；如果只有文件路径，请简单引入，例如“详细结果保存路径为：……”。
        - 如果总体任务中包含通过画图分析数据趋势，请根据工具调用结果，简要描述一下数据的趋势。
        - 工具调用结果中有确切数据的部分，将工具执行的参数、公式和量化结果都加粗显示，结果路径不用加粗显示。
        - 在展示结果路径时，**请将路径转换为对应的html代码**，我们的路径结构为：本地保存结果文件夹(xxresult_data)、session_id、结果文件（例如.csv)。输出html的时候，<a>标签内应使用本地的ip一级对应的session_id和文件名称。
        - 例如，保存路径为 D:/...result_data/number/cell_status.csv，则应该输出 “D:/...result_data/number/cell_status.csv <a href='http://ip_addresses:agent_port/xx/cell_status.csv' download>点击下载</a> ”

        【时间相关规则】
        如果工具的参数涉及时间，请根据我提供的时间信息进行填参，当前的时间是：2025年9月22日 0:00
        已知道信息： 2025年9月21日是星期天，9月22日是星期一。一个星期有7天。
        工具对时间区间是按左闭右开区间处理的，因此起始时间和结束时间的填参要注意：如果是“0点到2点”，则填参为00:00到02:00，如果是“0点到2点的三个小时”，则填参为00:00到02:59。

        **请注意，我们的整体任务可能非常复杂。以下是一些可能帮助您解决任务的提示：**
        <tips>
        - 请按照总体计划，调用计划中指定的工具，禁止调用其他工具。
        - 如果一种方式未能提供答案，请尝试其他方式或方法。答案确实存在。
        - 不要过于自信您自己的知识。调用工具可以提供更专业的视角，并帮助验证现有知识。请尽量减少您自己生成的内容。
        - 当工具运行失败时，永远不要假设它返回了正确的结果并继续基于这种假设进行推理，因为假设的结果不能引导您得到正确的答案。正确的做法是考虑错误的原因并再次尝试。
        - 调用工具出现报错信息时，可以调整填参后重新尝试，最多3次，3次后仍未成功则视为失败，请立即停止运行，禁止死循环！
        - **每一步都需要确认参数，如果任务没有提到额外参数，或者提到的参数与工具现有的参数库不匹配，不用填参，使用默认参数（参数填为空即可）。**
        - 确保保留工具result返回结果的源格式。
        - 禁止编造结果路径，请严格根据工具执行结果给出回答。若工具没有提到结果保存路径，说明结果不是以csv等文件形式保存，只是文字结果。
        - 增益计算工具求减少率最高的top_n，即为求增益率最低的top_n，所以要注意填参时的排序顺序。
        - 注意区分 rruid 和 enodeb。rruid 为 enodeb_柜号_框号_槽号的形式（例如HHxx_xx-xxx_xx_0_131_0），最后三项表示柜号_框号_槽号（0_131_0），前面为enodeb名（HHxx_xx-xxx_xx）。
        - 部分kpi指标请区分“上行”和“下行”
        - 查询kpi指标时，如果用户未指明求均值还是总和，默认求均值。例如“某天的xx数据量”、“xx流量”、“xx次数”等，只要用户未明确指定求总和，就不要擅自填写groupby为sum，而应为average。
        - 当使用网络性能指标汇聚工具时，计划步骤中的kpi名称可能不准确，请确保工具填参的kpi指标名称与“kpi名称-公式对照表”中的名称完全一致，确保准确无误。
        - 当使用网络性能指标汇聚工具时，若计划步骤中的kpi指标名称是英文或公式，填参应为“kpi名称-公式对照表”中对应的**中文名称**。
        - 以下是kpi名称-公式对照表：{candidate_kpis}
        - 当使用小区过滤工具时，请确保工具填参的参数列名称与“工参名称表”中的**英文列名**完全一致，禁止填写中文名称。
        - 以下是工参名称表：{candidate_filters}
        - 当使用配置信息查询工具时，请确保工具填参的配置项名称与”配置名称表”中的名称完全一致。
        - 以下是配置名称表：{candidate_configures}
        - 当计划中的指标名称来自alias映射时，请将alias.key对应的所有value（标准KPI中文名）完整传入kpi_array，禁止自行筛选或丢弃。以下是alias映射表：{candidate_alias}
        </tips>
        这是我们的整体任务：<task>{cur_task}</task>。永远不要忘记我们的任务！
        系统确认信息为：<confirm>{confirm_info}</confirm>

        当前需要执行的计划步骤：
        {current_plan}
        """

        _msgs = [{"role": "user", "content": executor_system}]
        _history = tool_history if isinstance(tool_history, list) else []
        for h in _history:
            step = h.get('step', '?')
            tname = h.get('tool_name', 'unknown')
            if isinstance(tname, str):
                tname = tname.strip('"')
            targs = h.get('tool_args', {})
            tresult = h.get('tool_result', {})
            args_display = {k: v for k, v in targs.items() if k != 'tool_name' and v is not None}
            _msgs.append({
                "role": "assistant",
                "content": None,
                "tool_calls": [{
                    "id": f"call_{step}",
                    "type": "function",
                    "function": {
                        "name": tname,
                        "arguments": json.dumps(args_display, ensure_ascii=False)
                    }
                }]
            })
            _msgs.append({
                "role": "tool",
                "tool_call_id": f"call_{step}",
                "content": json.dumps(tresult, ensure_ascii=False) if isinstance(tresult, (dict, list)) else str(tresult)
            })

        result = {
            "messages": _msgs,
            "tools": openai_tool_schema,
            "loop_count": _count,
            "model": "deepseek-v3",
            "max_tokens": 10000,
            "temperature": 0.1,
            "top_p": 0.8,
            "chat_template_kwargs": {"enable_thinking": False},
            "enable_thinking": False,
            "stream": True,
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      exec_result: ${python_result}
      output_parser:
        show_title: false
        show_content: false
    next:
      call_exec_llm:
        condition: ''

  call_exec_llm:
    type: restful
    description: 调用 executor LLM
    inputs:
      api_name: "chat_completions"
      verify_ssl: "false"
      timeout: "120"
      model: ${exec_result.model}
      messages: ${exec_result.messages}
      max_tokens: ${exec_result.max_tokens}
      temperature: ${exec_result.temperature}
      top_p: ${exec_result.top_p}
      tools: ${exec_result.tools}
      tool_choice: "auto"
      chat_template_kwargs: ${exec_result.chat_template_kwargs}
      enable_thinking: ${exec_result.enable_thinking}
    outputs:
      exec_response: ${api_response}
      exec_llm_output: ${api_response.choices[0].message.content}
      exec_llm_tool_calls: ${api_response.choices[0].message.tool_calls}
    next:
      parse_exec_response:
        condition: ''

  parse_exec_response:
    type: python
    description: 解析 executor LLM 响应：提取工具调用参数或直接回答
    inputs:
      exec_llm_output: ${exec_llm_output}
      exec_llm_tool_calls: ${exec_llm_tool_calls}
      script: |-
        import json
        tc = exec_llm_tool_calls
        if tc:
            if isinstance(tc, str):
                try:
                    tc = json.loads(tc)
                except Exception:
                    tc = None
        if tc and isinstance(tc, list) and len(tc) > 0:
            first = tc[0]
            if isinstance(first, dict):
                fn = first.get("function", {})
                n = fn.get("name", "")
                args_str = fn.get("arguments", "{}")
                try:
                    api_params = json.loads(args_str) if isinstance(args_str, str) else args_str
                except Exception:
                    api_params = {}
                tool_args = api_params
                model_map = {"compute_cell_kpi": "Qwen3-32B", "region_creation": "Qwen3-32B", "draw_graphs": "Qwen3-32B", "calculate_gain": "Qwen3-32B", "bts_energy_analyze": "Qwen3-32B", "configuration_query": "Qwen3-32B"}
                _model = model_map.get(n, "Qwen3-32B")
                args_lines = [f"- {k}: {v}" for k, v in api_params.items()]
                args_str = " ".join(args_lines)
                tool_display = f"> 执行工具 {n} | 参数: {args_str} "
                r = {
                    "exec_has_tool_call": "yes",
                    "exec_direct_answer": "",
                    "tool_name": n,
                    "tool_args": tool_args,
                    "model": _model,
                    "tool_display_text": tool_display,
                }
            else:
                r = {"exec_has_tool_call": "no", "exec_direct_answer": exec_llm_output if isinstance(exec_llm_output, str) else str(exec_llm_output), "tool_name": "", "tool_args": ""}
        else:
            r = {"exec_has_tool_call": "no", "exec_direct_answer": exec_llm_output if isinstance(exec_llm_output, str) else str(exec_llm_output), "tool_name": "", "tool_args": ""}
        print(json.dumps(r, ensure_ascii=False))
    outputs:
      exec_has_tool_call: ${python_result.exec_has_tool_call}
      exec_direct_answer: ${python_result.exec_direct_answer}
      tool_name: ${python_result.tool_name}
      tool_args: ${python_result.tool_args}
      model: ${python_result.model}
      tool_display_text: ${python_result.tool_display_text}
    next:
      display_exec_direct_answer:
        condition: ${exec_has_tool_call == "no"}
      route_tool:
        condition: ${exec_has_tool_call == "yes"}

  display_exec_direct_answer:
    type: display-content
    description: 展示 executor 的直接回答（无工具调用）
    inputs:
      content: ${exec_direct_answer}
    outputs:
      fmsg: ${exec_direct_answer}
      output_parser:
        type: HTML
    next:
      display_final_result:
        condition: ''

  # ── 工具路由（exclusive gateway）──
  route_tool:
    type: display-content
    description: 根据 tool_name 路由到对应工具的 restful 调用
    inputs:
    outputs:
      smsg2: dummy
    next:
      call_kpi:
        condition: ${tool_name == "compute_cell_kpi"}
      call_param:
        condition: ${tool_name == "region_creation"}
      call_draw:
        condition: ${tool_name == "draw_graphs"}
      call_gain:
        condition: ${tool_name == "calculate_gain"}
      call_energy:
        condition: ${tool_name == "bts_energy_analyze"}
      call_config:
        condition: ${tool_name == "configuration_query"}

  # ── 1. KPI 工具 ──
  call_kpi:
    type: restful
    description: 调用 KPI 指标汇聚 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "compute_cell_kpi"
      verify_ssl: "false"
      timeout: "120"
      model: ${model}
      tool_name: "compute_cell_kpi"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 2. 工参筛选工具 ──
  call_param:
    type: restful
    description: 调用工参筛选 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "region_creation"
      verify_ssl: "false"
      timeout: "600"
      model: ${model}
      tool_name: "region_creation"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 3. 绘图工具 ──
  call_draw:
    type: restful
    description: 调用绘图 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "draw_graphs"
      verify_ssl: "false"
      timeout: "600"
      model: ${model}
      tool_name: "draw_graphs"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 4. 增益计算工具 ──
  call_gain:
    type: restful
    description: 调用增益计算 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "calculate_gain"
      verify_ssl: "false"
      timeout: "600"
      model: ${model}
      tool_name: "calculate_gain"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 5. 能耗分析工具 ──
  call_energy:
    type: restful
    description: 调用能耗分析 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "bts_energy_analyze"
      verify_ssl: "false"
      timeout: "600"
      model: ${model}
      tool_name: "bts_energy_analyze"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  # ── 6. 配置查询工具 ──
  call_config:
    type: restful
    description: 调用配置查询 API
    next:
      update_tool_history:
        condition: ''
    inputs:
      api_name: "configuration_query"
      verify_ssl: "false"
      timeout: "600"
      model: ${model}
      tool_name: "configuration_query"
      arguments: ${tool_args}
    outputs:
      tool_result: ${api_response}
      tool_display_text: ${tool_display_text}

  update_tool_history:
    type: python
    description: 将本次工具调用+结果追加到 tool_history，更新 loop_count
    inputs:
      tool_name: ${tool_name}
      tool_args: ${tool_args}
      tool_result: ${tool_result}
      loop_count: ${loop_count}
      tool_history: ${tool_history}
      current_plan: ${current_plan}
      param_to_json_str: "true"
      script: |-
        import json

        tool_args=json.loads(tool_args)
        tool_result=json.loads(tool_result)
        tool_history=json.loads(tool_history)

        _count = int(loop_count) if isinstance(loop_count, (int, str)) and str(loop_count).isdigit() else 0

        _count += 1
        _history = tool_history if isinstance(tool_history, list) else []
        _record = {
            "step": _count,
            "tool_name": tool_name,
            "tool_args": tool_args if isinstance(tool_args, dict) else {},
            "tool_result": tool_result if isinstance(tool_result, (dict, list)) else str(tool_result),
        }
        _new_history = _history + [_record]

        _reached_max = "yes" if _count >= 10 else "no"
        result = {
            "loop_count": _count,
            "tool_history": _new_history,
            "current_plan": current_plan,
            "reached_max_loop": _reached_max
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      loop_count: ${python_result.loop_count}
      tool_history: ${python_result.tool_history}
      current_plan: ${python_result.current_plan}
      reached_max_loop: ${python_result.reached_max_loop}
    next:
      display_max_loop_warning:
        condition: ${reached_max_loop == "yes"}
      build_exec_messages:
        condition: ${reached_max_loop == "no"}

  display_max_loop_warning:
    type: display-content
    description: 达到最大执行步数限制
    inputs:
      content: 已达到最大执行步数限制（10步），当前结果如下
    outputs:
      fmsg: 已达到最大执行步数限制（10步），当前结果如下
    next:
      display_final_result:
        condition: ''

  display_final_result:
    type: display-content

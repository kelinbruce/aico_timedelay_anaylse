name: WATT_Old_Tool_Test_v1
description: 问数老工具全流程
domain: WATT
scene: old-tool-test
lang: zh
version: 1.0.0
type: boot-recipe

nodes:
  start_node:
    type: start-event
    description: 用户问题入口
    next:
      preprocess:
        condition: ''

  # ── 预处理 ──
  preprocess:
    type: python
    description: 预处理：清洗历史对话，构建查询文本
    next:
      parallel_search:
        condition: ''
    inputs:
      input_question: ${input_question}
      script: |-
        import re
        import json

        question = input_question
        chat_history_key = [{'role': 'user', 'content': question}]

        def remove_tool_call_blocks(text):
            if not text:
                return text
            text = re.sub(r"<think[\s\S]*?\<\/think>", "", text, flags=re.IGNORECASE)
            text = re.sub(r"###\s*🛠️\s*Tool\s*Call[\s\S]*?(?=###\s*🤖\s*Executor\s*Agent|###\s|\Z)", "", text, flags=re.IGNORECASE)
            text = re.sub(r">\s*已执行工具[\s\S]*?(?=###\s|\Z)", "", text, flags=re.IGNORECASE)
            text = re.sub(r"[ \t]+", " ", text)
            text = re.sub(r"\n{2,}", "\n\n", text)
            return text.strip()

        query = " ".join([remove_tool_call_blocks(k['content']) for k in chat_history_key])
        query += " " + question

        result = {
            "chat_history_key": chat_history_key,
            "query": query
        }
        print(json.dumps(result, ensure_ascii=False))
    outputs:
      chat_history_key: ${python_result.chat_history_key}
      query: ${python_result.query}

  # ══════════════════════════════════════════════════════
  # ── 并行7路 type-filtered RAG 检索 ──
  # ══════════════════════════════════════════════════════
  parallel_search:
    type: parallel-gateway
    description: 并行发起7路type-filtered检索
    next:
      build_search_kpi_body:
        condition: ''
      build_search_kpi_cn_body:
        condition: ''
      build_search_filter_body:
        condition: ''
      build_search_configure_body:
        condition: ''
      build_search_cell_body:
        condition: ''
      build_search_enodeb_body:
        condition: ''
      build_search_rru_body:
        condition: ''
      build_search_site_body:
        condition: ''
    inputs:
      join_timeout: "120"
      join_node: "parallel_search_join"

  # ── 1. KPI 检索 ──
  build_search_kpi_body:
    type: python
    description: 构建test_feature索引type=kpi的搜索请求体
    next:
      search_kpi:
        condition: ''
    inputs:
      input_question: ${input_question}
      script: |-
        import json
        body = {
            "query": input_question,
            "max_num_results": 50,
            "ranking_options": {"ranker": "merge"},
            "termweight_options": {"termweighter": "none", "topn": 3},
            "search_strategies": [{"strategy": "text", "top_k": 50}],
            "filters": {"type": "and", "filters": [{"key": "metadata.type", "value": "kpi", "type": "equals"}]},
        }
        print(json.dumps(body, ensure_ascii=False))
    outputs:
      kpi_body: ${python_result}
      output_parser:
        show_title: false
        show_content: false

  search_kpi:
    type: restful
    description: 检索test_feature索引中type=kpi的数据
    next:
      parallel_search_join:
        condition: ''
    inputs:
      api_name: "search_feature"
      verify_ssl: "false"
      query: ${kpi_body.query}
      max_num_results: ${kpi_body.max_num_results}
      ranking_options: ${kpi_body.ranking_options}
      termweight_options: ${kpi_body.termweight_options}
      search_strategies: ${kpi_body.search_strategies}
      filters: ${kpi_body.filters}
    outputs:
      kpi_response: ${api_response}
      kpi_data: ${api_response.data}
      output_parser:
        show_title: false
        show_content: false

  build_search_kpi_cn_body:
    type: python
    description: 构建test_feature索引type=kpi cn的搜索请求体
    next:
      search_kpi_cn:
        condition: ''
    inputs:
      input_question: ${input_question}

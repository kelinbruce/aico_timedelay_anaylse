      description: 撤销发布长期记忆响应
      properties:
        memoryId:
          type: string
          description: 已删除 SHARED memory ID
      required:
        - memoryId

    SharingLongTermMemoryReq:
      type: object
      description: 共享操作请求（发布/取消发布共用）
      properties:
        tenantId:
          type: string
          description: Owner Scope 租户
          minLength: 1
          maxLength: 64
        userId:
          type: string
          description: 发布者用户
          minLength: 1
          maxLength: 64
        agentId:
          type: string
          description: Agent Scope
          minLength: 1
          maxLength: 64

swagger: "2.0"
info:
  version: "1.0.0"
  x-owner-id: llm-api
  title: WATT LLM API
  x-en-title: WATT LLM API
  description: WATT LLM聊天补全API，用于智能体的模型调用
  x-en-description: WATT LLM Chat Completions API for agent model invocation
  x-namespace: WATT
  x-llm-spec-version: this_is_llm_spec_version2.0
schemes:
  - https
host: localhost.com
basePath: /rest/netrsn/v1
tags:
  - name: LLMChat
paths:
  /chat/completions:
    post:
      operationId: chat_completions
      tags:
        - LLMChat
      summary: "chat_completions"
      x-en-summary: "chat_completions"
      description: OpenAI兼容的聊天补全接口，用于调用大语言模型
      x-en-description: OpenAI-compatible chat completions endpoint for LLM invocation
      x-llm-friendly: true
      x-llm-tag: llm-chat
      x-function-category: 模型调用
      x-question-example:
        - question: 调用模型进行意图分类
        - question: 调用模型进行协商
        - question: 调用模型生成执行计划
      x-en-question-example:
        - question: Call model for intent classification
        - question: Call model for negotiation
        - question: Call model for plan generation
      x-is-registered: "N"
      x-support-sdk: "N"
      produces:
        - application/json
      x-info:
        apiGroup:
          - this_is_group3
        ownerService: this_is_ownerService
        ownerSystemVersion: this_is_ownerSystemVersion_V100R25C10
        accessType: INNER_IR
        apiAccessTag: interTest
        apiDriver: MasterCoreSystem
      parameters:
        - in: body
          name: body
          description: 聊天补全请求体
          required: true
          schema:
            $ref: "#/definitions/ChatCompletionRequest"
      responses:
        "200":
          description: 聊天补全响应
          schema:
            $ref: "#/definitions/ChatCompletionResponse"
definitions:
  ChatCompletionRequest:
    description: 聊天补全请求
    type: object
    required:
      - model
      - messages
    properties:
      model:
        type: string
        description: 模型名称
        x-en-description: Model name
        example: "netmo-deepseek-v3.2"
      messages:
        type: array
        description: 消息列表
        x-en-description: Message list
        items:
          $ref: "#/definitions/ChatMessage"
      max_tokens:
        type: integer
        description: 最大生成token数
        x-en-description: Maximum number of tokens to generate
        default: 10000
      temperature:
        type: number
        description: 采样温度（0-2）
        x-en-description: Sampling temperature (0-2)
        default: 0.1
      top_p:
        type: number
        description: 核采样参数
        x-en-description: Nucleus sampling parameter
        default: 0.7
      stream:
        type: boolean
        description: 是否流式返回
        x-en-description: Whether to stream the response
        default: false
      chat_template_kwargs:
        $ref: "#/definitions/ChatTemplateKwargs"
      enable_thinking:
        type: boolean
        description: 是否关闭思考
        x-en-description: Whether to disable think
        default: false
      tools:
        type: array
        description: 模型可调用的工具列表
        x-en-description: List of tools the model may call
        items:
          $ref: "#/definitions/ChatTool"
      tool_choice:
        type: string
        description: tool
        x-en-description: Model name
        example: "auto"
  ChatMessage:
    description: 聊天消息
    type: object
    required:
      - role
    properties:
      role:
        type: string
        description: 消息角色
        x-en-description: Message role
        enum: ["system", "user", "assistant", "tool"]
        example: "user"
      tool_calls:
        type: array
        description: 模型生成的工具调用（role=assistant时）
        x-en-description: Tool calls generated by the model (when role=assistant)
        items:
          $ref: "#/definitions/ChatToolCall"
      tool_call_id:
        type: string
        description: 工具调用ID（role=tool时用于匹配）
        x-en-description: Tool call ID (used when role=tool)
  ChatTool:
    description: 工具定义
    type: object
    required:
      - type
      - function
    properties:
      type:
        type: string
        description: 工具类型
        x-en-description: Tool type
        enum: ["function"]
        example: "function"
      function:
        $ref: "#/definitions/ChatToolFunction"
  ChatToolFunction:
    description: 工具函数定义
    type: object
    required:
      - name
      - parameters
    properties:
      name:
        type: string
        description: 函数名称
        x-en-description: Function name
        example: "query_pm"
      description:
        type: string
        description: 函数描述
        x-en-description: Function description
      parameters:
        type: object
        description: 函数参数的JSON Schema
        x-en-description: JSON Schema for function parameters
  ChatToolCall:
    description: 工具调用
    type: object
    properties:
      id:
        type: string
        description: 工具调用ID
        x-en-description: Tool call ID
        example: "call_abc123"
      type:
        type: string
        description: 调用类型
        x-en-description: Call type
        enum: ["function"]
      function:
        type: object
        description: 被调用的函数
        x-en-description: The function being called
        properties:
          name:
            type: string
            description: 函数名
            x-en-description: Function name
          arguments:
            type: string
            description: 函数参数JSON字符串
            x-en-description: Function arguments as JSON string
  ChatCompletionResponse:
    description: 聊天补全响应
    type: object
    properties:
      id:
        type: string
        description: 响应ID
        x-en-description: Response ID
        example: "chatcmpl-abc123"
      object:
        type: string
        description: 对象类型
        x-en-description: Object type
        example: "chat.completion"
      created:
        type: integer
        description: 创建时间戳
        x-en-description: Creation timestamp
      model:
        type: string
        description: 使用的模型名称
        x-en-description: Model name used
        example: "netmo-deepseek-v3.2"
      choices:
        type: array
        description: 补全选项列表
        x-en-description: List of completion choices
        items:
          $ref: "#/definitions/ChatCompletionChoice"
      usage:
        $ref: "#/definitions/ChatCompletionUsage"
  ChatCompletionChoice:
    description: 补全选项
    type: object
    properties:
      index:
        type: integer
        description: 选项索引
        x-en-description: Choice index
      message:
        $ref: "#/definitions/ChatMessage"
      finish_reason:
        type: string
        description: 结束原因
        x-en-description: Finish reason
        example: "stop"
  ChatCompletionUsage:
    description: token使用量
    type: object
    properties:
      prompt_tokens:
        type: integer
        description: 输入token数
        x-en-description: Number of prompt tokens
      completion_tokens:
        type: integer
        description: 输出token数
        x-en-description: Number of completion tokens
      total_tokens:
        type: integer
        description: 总token数
        x-en-description: Total number of tokens
  ChatTemplateKwargs:
    description: 模型聊天模板参数
    type: object
    properties:
      enable_thinking:
        type: boolean
        description: 是否启用思考过程
        x-en-description: Whether to enable thinking
        default: false

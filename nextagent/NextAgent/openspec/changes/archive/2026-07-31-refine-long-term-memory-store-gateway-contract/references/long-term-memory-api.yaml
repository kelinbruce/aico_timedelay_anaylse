          properties:
            sourceMemoryId:
              type: string
              description: 发布来源 memory ID
            ownerUserId:
              type: string
              description: 发布者用户 ID
          required:
            - sourceMemoryId
            - ownerUserId

    LongTermMemorySummaryPage:
      type: object
      description: 长期记忆摘要分页输出
      properties:
        items:
          type: array
          description: 当前页条目
          items:
            $ref: '#/components/schemas/LongTermMemorySummary'
        total:
          type: integer
          format: int64
          description: 匹配总数
        offset:
          type: integer
          format: int32
          description: 当前偏移
        limit:
          type: integer
          format: int32
          description: 当前页大小
      required:
        - items
        - total
        - offset
        - limit

    SearchItemPage:
      type: object
      description: 检索结果分页输出
      properties:
        items:
          type: array
          description: L1 搜索结果
          items:
            $ref: '#/components/schemas/SearchItem'
        total:
          type: integer
          format: int64
          description: 匹配总数
        offset:
          type: integer
          format: int32
          description: 固定返回 0
        limit:
          type: integer
          format: int32
          description: 当前页大小

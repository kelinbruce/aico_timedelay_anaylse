swagger: '2.0'
info:
  title: Common Definitions
  version: 1.0.0
  description: Shared error response schemas used across all NextAgent API modules.
host: localhost:3000
basePath: /
schemes:
  - https
definitions:
  SafeErrorResponse:
    type: object
    required:
      - error
    properties:
      error:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: string
            minLength: 1
          message:
            type: string
            minLength: 1
        additionalProperties: false
    additionalProperties: false
  MemoryErrorResponse:
    type: object
    required:
      - code
      - message
      - retryable
    properties:
      code:
        type: string
        minLength: 1
      message:
        type: string
        minLength: 1
      retryable:
        type: boolean
    additionalProperties: false

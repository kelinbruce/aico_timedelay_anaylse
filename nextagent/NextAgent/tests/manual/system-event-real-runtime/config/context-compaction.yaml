paths:
  workspaceRoot: state/context-compaction/workspaces
  logDirectory: state/context-compaction/logs
  agentRoot: config/agents
channel:
  port: 3112
hostedAgent:
  activeAgentId: system-event-context-agent
modelProfiles:
  - providerId: openai-compatible
    baseUrl: env:OPENAI_BASE_URL
    credentialRef: env:OPENAI_API_KEY
    models:
      - modelId: env:OPENAI_MODEL_NAME
        displayName: MiniMax context-compaction verification
        contextWindowTokens: 13257
        fallbackEligible: false
        maxOutputTokens: 256
        timeoutMs: 120000

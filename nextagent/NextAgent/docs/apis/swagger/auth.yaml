swagger: '2.0'
info:
  title: Auth API
  version: 1.0.0
  description: >-
    NextAgent Web Channel API. All endpoints are served under the /api/v1 prefix unless noted otherwise (health
    endpoints use root paths). Authentication uses a cookie-based local auth flow for loopback deployments.
host: localhost:3000
basePath: /
schemes:
  - https
paths:
  /api/v1/auth/local/login:
    post:
      operationId: localLogin
      summary: Authenticate with local credential
      tags:
        - Auth
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/LoginBody'
      responses:
        '200':
          description: Login successful
          schema:
            $ref: '#/definitions/LoginResponse'
        '401':
          description: Authentication failed
  /api/v1/auth/local/logout:
    post:
      operationId: localLogout
      summary: Clear local auth cookie
      tags:
        - Auth
      produces:
        - application/json
      responses:
        '200':
          description: Logout successful
          schema:
            $ref: '#/definitions/LogoutResponse'
definitions:
  LoginBody:
    type: object
    required:
      - credential
    properties:
      credential:
        type: string
        minLength: 1
        maxLength: 4096
    additionalProperties: false
  LoginResponse:
    type: object
    required:
      - identity
    properties:
      identity:
        type: object
        required:
          - tenantId
          - subjectId
        properties:
          tenantId:
            type: string
          subjectId:
            type: string
          displayName:
            type: string
        additionalProperties: false
    additionalProperties: false
  LogoutResponse:
    type: object
    required:
      - ok
    properties:
      ok:
        type: boolean
    additionalProperties: false
